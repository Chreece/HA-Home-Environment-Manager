<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="332" viewBox="0 0 1200 332" role="img" aria-labelledby="title desc">
<title id="title">HEM  -  Home Environment Manager</title>
<desc id="desc">The HEM home and airflow mark with ventilation guidance, room temperature, humidity and air-quality readings, reflecting the actual Home Assistant card.</desc>
<defs>
  <linearGradient id="hem-tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e7395"/><stop offset="1" stop-color="#072c52"/></linearGradient>
  <linearGradient id="hem-banner-back" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#08192d"/><stop offset=".56" stop-color="#0a3044"/><stop offset="1" stop-color="#07505c"/></linearGradient>
  <radialGradient id="hem-glow"><stop stop-color="#1ad9c8" stop-opacity=".26"/><stop offset="1" stop-color="#1ad9c8" stop-opacity="0"/></radialGradient>
  <symbol id="hem-mark" viewBox="0 0 128 128">
    <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#hem-tile)"/>
    <rect x="6" y="6" width="116" height="116" rx="24" fill="none" stroke="#70e5e6" stroke-opacity=".33" stroke-width="2"/>
    <path d="M25 58 64 25l39 33M32 57v45h64V57" fill="none" stroke="#e9fcff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="43" y="61" width="32" height="40" rx="2" fill="none" stroke="#e9fcff" stroke-width="5"/>
    <path d="M59 62v38M44 81h30" fill="none" stroke="#e9fcff" stroke-width="4"/>
    <path d="M71 69q20 12 41-2M71 84q20 12 41-2M71 98q20 10 41-2" fill="none" stroke="#4ae0d8" stroke-width="5" stroke-linecap="round"/>
  </symbol>
</defs>
<defs><clipPath id="clip"><rect width="1200" height="332" rx="24"/></clipPath></defs>
<g clip-path="url(#clip)" font-family="DejaVu Sans,Arial,sans-serif">
 <rect width="1200" height="332" fill="url(#hem-banner-back)"/>
 <ellipse cx="820" cy="110" rx="420" ry="300" fill="url(#hem-glow)"/>
 <path d="M0 285Q240 215 500 280T1200 248" fill="none" stroke="#32dcda" stroke-width="3" opacity=".22"/>
 <path d="M0 318Q280 249 575 300T1200 271" fill="none" stroke="#0b9ac1" stroke-width="25" opacity=".1"/>
 <rect x="22" y="22" width="1156" height="288" rx="20" fill="none" stroke="#77dbeb" stroke-opacity=".19"/>
 <use href="#hem-mark" x="54" y="75" width="171" height="171"/>
 <text x="262" y="148" fill="#f3fcff" font-size="86" font-weight="800" letter-spacing="3">HEM</text>
 <text x="267" y="192" fill="#c0e4ee" font-size="27" font-weight="650">Home Environment Manager</text>
 <text x="267" y="226" fill="#81b2bf" font-size="18">A smarter home, room by room</text>
 <rect x="708" y="61" width="440" height="209" rx="18" fill="#061928" fill-opacity=".82" stroke="#55d7dd" stroke-opacity=".24"/>
 <rect x="725" y="78" width="405" height="53" rx="11" fill="#0c3e40" stroke="#37c7b5" stroke-opacity=".48"/>
 <circle cx="747" cy="104" r="10" fill="#23c7a6" fill-opacity=".2"/>
 <path d="m742 104 4 4 7-8" fill="none" stroke="#3cddba" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="772" y="111" fill="#e1fbf7" font-size="19" font-weight="700">Ventilation ready</text>
 <text x="733" y="158" fill="#a9d2dd" font-size="15">Living room</text>
 <g font-size="20" font-weight="700">
  <rect x="725" y="171" width="122" height="48" rx="9" fill="#122f40" stroke="#315466"/>
  <rect x="858" y="171" width="122" height="48" rx="9" fill="#122f40" stroke="#315466"/>
  <rect x="991" y="171" width="139" height="48" rx="9" fill="#122f40" stroke="#315466"/>
  <text x="734" y="202" fill="#f0fdff">20.5°C</text><text x="868" y="202" fill="#f0fdff">48% RH</text><text x="1003" y="202" fill="#f0fdff">AQI 13</text>
 </g>
 <text x="731" y="250" fill="#79b2c1" font-size="14">Temperature · Humidity · Mold · Air quality</text>
</g>
</svg>
