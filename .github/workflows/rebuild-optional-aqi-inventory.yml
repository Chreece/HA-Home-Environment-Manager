name: Refresh HEM source inventory (one shot)
on:
  push:
    branches: [feat/optional-balcony-door-window-contacts-20261114]
    paths: [.github/workflows/rebuild-optional-aqi-inventory.yml]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'Chreece/HA-Home-Environment-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Recalculate and validate settings inventory
        run: |
          set -euo pipefail
          python -I .github/scripts/audit_settings.py
          python -I .github/scripts/audit_settings.py --check
          git diff --check
      - name: Commit source inventory and delete one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/rebuild-optional-aqi-inventory.yml
          git add docs/settings-inventory.json
          git add -u .github/workflows/rebuild-optional-aqi-inventory.yml
          git diff --cached --check
          git commit -m 'test: update source inventory after optional AQI policy'
          git push origin HEAD:refs/heads/feat/optional-balcony-door-window-contacts-20261114
