name: Verify Home Environment Manager beta 109 setpoint sequence
on:
  push:
    branches: ['work/v0.6.0b109']
permissions:
  contents: read
concurrency:
  group: hem-beta109-setpoint-sequence
  cancel-in-progress: true
jobs:
  verify-setpoint-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install browser test dependency
        run: python -m pip install 'playwright==1.57.0'
      - name: Render startup and shutdown waits with exact seconds
        env:
          HEM_TEST_SCREENSHOT_DIR: artifacts/setpoint-sequence
        run: |
          node --check frontend/air-quality-advisor-card.js
          python -I .github/tests/test_beta109_setpoint_grace_browser.py
          python -I .github/tests/test_beta108_setpoint_feedback_browser.py
          python -I .github/tests/test_beta107_room_metrics.py
      - name: Preserve browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hem-beta109-setpoint-sequence
          path: artifacts/setpoint-sequence
          if-no-files-found: error
          retention-days: 7
