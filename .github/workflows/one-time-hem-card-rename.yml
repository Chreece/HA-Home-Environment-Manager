name: One-time HEM card rename on feature branch
on:
  push:
    branches:
      - fix/v0.8.1b2-single-hem-card
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'Chreece/HA-Home-Environment-Manager' && github.ref == 'refs/heads/fix/v0.8.1b2-single-hem-card'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Consolidate HEM custom card and remove legacy aliases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess
          root=Path('.')
          frontend=root/'custom_components/environment_manager/frontend'
          original=frontend/'air-quality-advisor-card.js'
          canonical=frontend/'home-environment-manager-card.js'
          overlay=frontend/'room-tab-connected.js'
          assert original.is_file() and overlay.is_file() and not canonical.exists()
          source=original.read_text(encoding='utf-8')
          override=overlay.read_text(encoding='utf-8')
          css_match=re.search(r'const css = `([\s\S]+?)`;', override)
          assert css_match and 'hem-room-glance87::before' in css_match.group(1)
          css=css_match.group(1)
          source=source.replace('AirQualityAdvisorCard','HomeEnvironmentManagerCard')
          source=source.replace('HA-Air-Quality-Advisor','HA-Home-Environment-Manager')
          source=source.replace('/* Air Quality Advisor for Home Assistant','/* Home Environment Manager for Home Assistant')
          begin=source.index("  if (!customElements.get('air-quality-advisor-card'))")
          finish=source.index('  /* HEM_SETTINGS_AUTOSAVE_B7_START', begin)
          sole_card="""  // Only the canonical Lovelace custom element and editor are registered.
          if (!customElements.get('home-environment-manager-card')) {
            customElements.define('home-environment-manager-card',HomeEnvironmentManagerCard);
          }
          if (!customElements.get('home-environment-manager-card-editor')) {
            customElements.define('home-environment-manager-card-editor',HomeEnvironmentManagerCardEditor);
          }
          HomeEnvironmentManagerCard.getConfigElement =
            () => document.createElement('home-environment-manager-card-editor');
          window.customCards = window.customCards || [];
          if (!window.customCards.some(card=>card.type==='home-environment-manager-card')) {
            window.customCards.push({
              type:'home-environment-manager-card',
              name:BRAND_TITLE,
              description:'Indoor air, moisture, thermal comfort, exposure and climate guidance.',
              preview:true,
              documentationURL:'https://github.com/Chreece/HA-Home-Environment-Manager',
              getEntitySuggestion:(hass,entityId) =>
                (hass.states[entityId]?.attributes?.dashboard?.version === 1 ||
                 hass.states[entityId]?.attributes?.dashboard_api === 'environment_manager/dashboard')
                  ? {config:{type:'custom:home-environment-manager-card',entity:entityId}}
                  : null
            });
          }
          """
          source=source[:begin]+sole_card+source[finish:]
          start=source.index('  /* HEM_ROOM_TABS080_START')
          stop_marker='  /* HEM_ROOM_TABS080_END */'
          stop=source.index(stop_marker,start)+len(stop_marker)
          replacement="""  /* HEM_ROOM_TABS081_CONNECTED_START
           * Built into HEM card: no race between two separate frontend resources.
           */
          const roomTabStyles081=HomeEnvironmentManagerCard.prototype._styles;
          HomeEnvironmentManagerCard.prototype._styles=function(){
            return roomTabStyles081.call(this)+`<style>
          """+css+"""
            </style>`;
          };
          /* HEM_ROOM_TABS081_CONNECTED_END */"""
          source=source[:start]+replacement+source[stop:]
          assert 'air-quality-advisor-card' not in source
          assert 'AirQualityAdvisorCard' not in source
          assert source.count("customElements.define('home-environment-manager-card',") == 1
          assert '.hem-room-fold87>summary.hem-room-glance87::before' in source
          canonical.write_text(source,encoding='utf-8')
          original.unlink()
          overlay.unlink()

          # Keep line positions unchanged for HEM's settings-inventory literal references.
          init=root/'custom_components/environment_manager/__init__.py'
          init_code=init.read_text(encoding='utf-8').replace('air-quality-advisor-card.js','home-environment-manager-card.js')
          init_lines=init_code.splitlines(keepends=True)
          found=[i for i,line in enumerate(init_lines) if '("room-tab-connected.js",' in line]
          assert len(found)==1
          init_lines[found[0]]='        # Connected room styling is now bundled in the main card.\n'
          init.write_text(''.join(init_lines),encoding='utf-8')

          # Migrate filename and custom type references in tests, docs, tooling and
          # source files. Preserve immutable historic release notes.
          touched=[]
          for b in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
            if not b: continue
            path=Path(b.decode())
            if path in (original,overlay) or not path.is_file() or path.is_symlink(): continue
            if path.parts[:2]==('.github','releases'): continue
            if path.suffix.lower() not in ('.py','.js','.json','.md','.yml','.yaml','.sh','.txt','.html','.css'): continue
            if path.stat().st_size>20_000_000: continue
            try: data=path.read_text(encoding='utf-8')
            except UnicodeDecodeError: continue
            updated=data.replace('air-quality-advisor-card','home-environment-manager-card')
            updated=updated.replace('AirQualityAdvisorCard','HomeEnvironmentManagerCard')
            if updated!=data:
              path.write_text(updated,encoding='utf-8')
              touched.append(str(path))
          assert not canonical.with_name('air-quality-advisor-card.js').exists()
          assert not overlay.exists()

          manifest=root/'custom_components/environment_manager/manifest.json'
          data=json.loads(manifest.read_text(encoding='utf-8'))
          assert data['version']=='0.8.1b1'
          data['version']='0.8.1b2'
          manifest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          room_test=root/'.github/tests/test_080_room_tabs.py'
          test=room_test.read_text(encoding='utf-8')
          # The extra script no longer exists and must never be necessary.
          test=re.sub(r'^CONNECTED_TAB = .*\n','',test,flags=re.M)
          test=re.sub(r'^\s+page.add_script_tag\(path=str\(CONNECTED_TAB\)\)\n','',test,flags=re.M)
          needle="                page.evaluate(SETUP, data)\n"
          assert test.count(needle)==1
          test=test.replace(needle,needle+"""                # No separate legacy custom card may be registered or suggested.
                assert page.evaluate('''() => !customElements.get(
                    'air-quality-advisor-card') && !customElements.get(
                    'air-quality-advisor-card-editor') &&
                    !!customElements.get('home-environment-manager-card') &&
                    !!customElements.get('home-environment-manager-card-editor') &&
                    window.customCards.filter(c=>c.type.includes('environment-manager-card')).length===1
                ''')
          """)
          room_test.write_text(test,encoding='utf-8')

          branding=root/'.github/tests/test_061b11_branding.py'
          test=branding.read_text(encoding='utf-8')
          needle="source=CARD.read_text(encoding='utf-8')\n"
          assert test.count(needle)==1
          test=test.replace(needle, needle+"""assert 'air-quality-advisor-card' not in source
          assert 'AirQualityAdvisorCard' not in source
          assert "customElements.define('home-environment-manager-card'," in source
          assert 'HEM_ROOM_TABS081_CONNECTED_START' in source
          assert 'hem-room-glance87::before' in source
          """)
          branding.write_text(test,encoding='utf-8')

          release=root/'.github/releases/v0.8.1b2.md'
          assert not release.exists()
          release.write_text("""# HEM v0.8.1b2 — Single canonical card and integrated connected tabs

          - Register and advertise only `home-environment-manager-card` and its editor. Remove the historical `air-quality-advisor-card` and editor aliases.
          - Rename the browser JavaScript asset to `home-environment-manager-card.js`, including server registration, tests, and release packaging.
          - Integrate the approved connected room-tab layout directly into the main card's stylesheet, preventing a second frontend script or load-order race.
          - Preserve room settings, overview readings, fold/disclosure, localization, mobile layouts, and backend control behavior.

          **Breaking Lovelace migration:** Any dashboard YAML using `type: custom:air-quality-advisor-card` must change that type to `type: custom:home-environment-manager-card`. The integration does not silently mutate user dashboards. Restart Home Assistant after updating HEM and then refresh the dashboard.
          """.replace('\n          ','\n'),encoding='utf-8')

          print('Migrated names across',len(touched),'tracked text files')
          print('\n'.join(touched[:100]))
          print('JS bytes:',canonical.stat().st_size)
          PY
          node --check custom_components/environment_manager/frontend/home-environment-manager-card.js
          python -I .github/tests/test_061b11_branding.py
          git rm --force .github/workflows/one-time-hem-card-rename.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "HEM v0.8.1b2: remove legacy card and bundle connected tabs"
          git push origin HEAD:fix/v0.8.1b2-single-hem-card
