name: HEM Beta93 native controller and physical title links

on:
  push:
    branches: ['fix/beta93-dual-native-controller-titles-20261102', 'release/v0.6.0b93']
  pull_request:
    branches: ['release/v0.6.0b93']

permissions:
  contents: read

jobs:
  verify-native-title-links:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate Beta93 frontend and protected physical source
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          assert json.loads(Path('manifest.json').read_text())['version']=='0.6.0b93'
          code=Path('frontend/air-quality-advisor-card.js').read_text()
          for marker in ('HEM_NATIVE_TITLE93_START','_nativeEndpoint93',
                         'data-open-physical93','data-open-controller89',
                         'data-managed-climate93','data-open-native89',
                         'HEM_PAGE_SCROLL92_START','HEM_STABLE_DOM91_START'):
              assert marker in code,marker
          assert len(list(Path('translations').glob('*.json')))==38
          print('BETA93_NATIVE_PRIMARY_PROVENANCE_AND_TWO_LINK_TARGETS=PASS')
          PY
          git fetch --no-tags --depth=1 origin 191e682f04f942b832d23eeeaca12f2dd96493d3
          python -I - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',
            '191e682f04f942b832d23eeeaca12f2dd96493d3','HEAD','--'],text=True).splitlines())
          expected={
            '.github/releases/v0.6.0b93.md',
            '.github/tests/test_beta93_native_entity_links.py',
            '.github/workflows/publish-beta93.yml',
            '.github/workflows/verify-beta93-native-links.yml',
            'frontend/air-quality-advisor-card.js',
            'manifest.json',
          }
          assert changed==expected,('BETA93_UNEXPECTED_SOURCE_CHANGES',
                                    sorted(changed-expected),sorted(expected-changed))
          print('BETA93_FRONTEND_ONLY_PROTECTED_RUNTIME=PASS')
          PY
          git diff --check
      - name: Keep all previously validated physical actuator protections
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta91_dry_only_pwm.py
          python -I .github/tests/test_beta91_pid_restart.py
          python -I .github/tests/test_beta88_power_startup_and_retries.py
          python -I .github/tests/test_beta90_window_evidence.py
      - name: Install Home Assistant and Chromium test dependencies
        run: python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
      - name: Exercise real browser native and HEM navigation, folding and scrolling
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta87_compact_browser.py
          python -I .github/tests/test_beta89_card.py
          python -I .github/tests/test_beta90_scroll_card.py
          python -I .github/tests/test_beta91_stable_dom.py
          python -I .github/tests/test_beta92_lovelace_scroll.py
          python -I .github/tests/test_beta93_native_entity_links.py
