name: Beta54 controller naming and DRY PID checks

on:
  push:
    branches:
      - fix/beta54-name-groups-dry-pid-recovery-20261027
  pull_request:
    branches:
      - beta/v0.6.0b53

jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax-check integration modules
        run: python -m compileall -q .
      - name: Verify controller names and delayed DRY PID registration
        run: python -m unittest discover -s tests -p 'test_beta54*.py' -v
      - name: Check dashboard JavaScript syntax
        run: node --check frontend/air-quality-advisor-card.js
