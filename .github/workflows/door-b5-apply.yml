name: Apply verified HEM door patch
on:
  push:
    branches: [feat/062b5-door-coordination-verified]
    paths: [.github/workflows/door-b5-apply.yml, .github/door-b5.patch]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Chreece/HA-Home-Environment-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply plain-text patch and verify exact locally tested files
        run: |
          set -euo pipefail
          test "$(git hash-object .github/door-b5.patch)" = 3d7760d129a7762bdddc7c65ea26032f7e3e861a
          git apply --check --unidiff-zero .github/door-b5.patch
          git apply --unidiff-zero .github/door-b5.patch
          python - <<'PY'
          import subprocess
          expected = {
              '.github/tests/test_062b3_door_entities.py': '4156a996f128bde9800557c0069da9ff9d4e8c01',
              '.github/tests/test_062b3_door_ui.py': 'f6b5a773179e6095a9901b2d498b81b94111e109',
              '.github/workflows/validate.yml': '6481c2ddcf96a0c35a1bdcc4c979fb26d6434958',
              'custom_components/environment_manager/door_context.py': '6a13f2a1a3be6d8928723df5ab1913b87e3c7182',
              'custom_components/environment_manager/door_entities.py': 'c0fdbe8585d5c04f9763d4040f2d1e72391d3102',
              'custom_components/environment_manager/door_settings.py': '3491a25b498b0b303ff610658c4fedf5c0ca8749',
              'custom_components/environment_manager/equipment_runtime.py': '191b0855a59dd7da4de9fb7bf3699fc252ed541d',
              'custom_components/environment_manager/frontend/air-quality-advisor-card.js': 'ff354da730400b291ffdb9f7d7d94632f9429f56',
              'custom_components/environment_manager/manager.py': '17a2b31fd8280f22021699d5d29fea0222b8f8f7',
              'custom_components/environment_manager/manifest.json': 'f69e0741d9c51a273e244ef2f18a5aec65d8aede',
              'custom_components/environment_manager/room_doors.py': '7e89a80c54c654e0a30612c4eb98f7ad0496a274',
              'custom_components/environment_manager/door_coordination.py': 'c5b8375bd965f630d8f5c2d71ee96d955315fce3',
              'custom_components/environment_manager/door_energy.py': '7ce8991e599c397bc0174446afe52efacdb860b1',
              '.github/tests/test_062b5_door_coordination.py': '0e02bfe84616743b999e802c362328ddb767a741',
              '.github/releases/v0.6.2b5.md': '10cbd7a01c80234bd161aa35ddc229be36762c93'
          }
          for path, digest in expected.items():
              actual = subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual == digest, (path, actual, digest)
          print('All 15 files match tested source')
          PY
          node --check custom_components/environment_manager/frontend/air-quality-advisor-card.js
          git diff --check
      - name: Verify startup, native dispatch and door evidence before recording branch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for entry in Path('custom_components/environment_manager').iterdir():
              target = Path(entry.name)
              assert not target.exists() and not target.is_symlink(), str(target)
              target.symlink_to(entry, target_is_directory=entry.is_dir())
          PY
          python -I .github/tests/test_062b3_door_context.py
          python -I .github/tests/test_062b3_door_entities.py
          python -I .github/tests/test_062b5_door_coordination.py
          python - <<'PY'
          from pathlib import Path
          for entry in Path('custom_components/environment_manager').iterdir():
              target = Path(entry.name)
              if target.is_symlink():
                  target.unlink()
          PY
      - name: Record verified non-workflow changes on feature branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp .github/workflows/validate.yml .github/door-b5-validated-workflow.txt
          git restore .github/workflows/validate.yml
          git add -u
          git add .github/door-b5-validated-workflow.txt
          git diff --cached --check
          git commit -m 'Wire verified door coordination, metered comparisons and regression gates'
          git push origin HEAD:refs/heads/feat/062b5-door-coordination-verified
