name: Publish Home Environment Manager beta 68
on:
  push:
    branches: ['release/v0.6.0b68']
permissions:
  contents: write
concurrency:
  group: home-environment-manager-beta68
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Finalize capability metadata and verify canonical source
        run: |
          set -euo pipefail
          mkdir -p dist
          python -I .github/scripts/finalize_beta68.py
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          assert m['domain']=='environment_manager' and m['version']=='0.6.0b68'
          locales=list(Path('translations').glob('*.json'));assert len(locales)==38
          for p in Path('.').rglob('*.json'):json.loads(p.read_text())
          for p in locales:
              d=json.loads(p.read_text());assert 'equipment_pause_on_window_open' in d['entity']['switch']
          print('PASS canonical integration, syntax and all 38 window-control locales')
          PY
      - name: All prior supply, PID, sleep, window, warning, lux and AQI regressions
        run: |
          set -euo pipefail
          for test in 61_supply_selection 62_pid_races 63_cold_start 64_sleep_idle 65_data 66_windows 67_aqi; do
            python -I ".github/tests/test_beta${test}.py"
          done | tee dist/previous-regressions.log
      - name: Bounded entity updates, newest room evidence and late native capabilities
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta68_events.py | tee dist/update-load.log
          python -I .github/tests/test_beta68_scheduler.py | tee dist/source-bursts.log
          python -I .github/tests/test_beta68_metadata.py | tee dist/capability-metadata.log
      - name: Test dependencies on CI runner only
        run: python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
      - name: Actual Home Assistant dispatcher and indexed state-event lifecycle
        run: |
          set -euo pipefail
          python -I -c 'from importlib.metadata import version; print("Home Assistant", version("homeassistant"))' | tee dist/real-ha-events.log
          timeout 90 python -I .github/tests/test_beta68_events.py --real-ha | tee -a dist/real-ha-events.log
      - name: Actual Chromium with large state inventory and translated controls
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta65_browser.py
          python -I .github/tests/test_beta68_browser.py | tee dist/browser-load.log
      - name: Prove Beta67 AQI implementation is unchanged
        run: |
          git fetch --no-tags --depth=1 origin adb5029d2f02d6d9f445e9dbe2819a340580e097
          git diff --exit-code adb5029d2f02d6d9f445e9dbe2819a340580e097 -- aqi_sources.py aqi_names.py compact_options.py device_controls.py select.py number.py environment_extended.py environment.py
          git diff --check
      - name: Commit only tested metadata correction without racing edits
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/release/v0.6.0b68 | cut -f1)"
          test "$current" = "$GITHUB_SHA" || { echo 'Release branch moved during tests'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equipment_feature_registration.py .github/patches/stability68.patch
          if ! git diff --cached --quiet; then
            git commit -m 'Beta68: retain late humidifier identity discovery without measurement-driven rebuilds'
            git push origin HEAD:refs/heads/release/v0.6.0b68
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD > dist/validated-commit.txt
      - name: Package and inspect the exact validated integration
        run: |
          python -I - <<'PY'
          import json,subprocess
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          archive=Path('dist/HA-Home-Environment-Manager-v0.6.0b68.zip')
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          prefix='custom_components/environment_manager/'
          with ZipFile(archive,'w',ZIP_DEFLATED,compresslevel=8) as z:
              for name in sorted(filter(None,names)):
                  if name.startswith(('.github/','tests/','dist/')) or name=='hacs.json' or '__pycache__' in name or name.endswith(('.pyc','.pyo')):continue
                  path=Path(name)
                  if path.is_file():z.write(path,prefix+name)
          with ZipFile(archive) as z:
              assert z.testzip() is None
              m=json.loads(z.read(prefix+'manifest.json'))
              assert m['domain']=='environment_manager' and m['version']=='0.6.0b68'
              for file in ('equipment_updates.py','equipment_window.py','equipment_runtime.py','manager.py','switch.py','aqi_sources.py','frontend/air-quality-advisor-card.js','translations/el.json'):
                  assert prefix+file in z.namelist(),file
              assert all(name.startswith(prefix) for name in z.namelist())
          print('PASS canonical validated ZIP',archive,archive.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta68-release-evidence
          path: dist/
          retention-days: 7
      - name: Publish HACS prerelease at tested source only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.6.0b68
          current="$(git ls-remote origin refs/heads/release/v0.6.0b68 | cut -f1)"
          test "$current" = "$RELEASE_SHA" || { echo 'Source changed; refusing stale tag'; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; leaving unchanged'; exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo 'Existing tag without release; refusing to repoint'; exit 1
          fi
          gh release create "$TAG" "dist/HA-Home-Environment-Manager-$TAG.zip#Manual installation ZIP" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'Home Environment Manager v0.6.0b68 - restored features and bounded updates' --notes-file ".github/releases/$TAG.md" --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets,url
