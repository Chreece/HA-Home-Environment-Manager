name: Publish validated beta

on:
  workflow_run:
    workflows: [Validate Home Environment Manager]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hem-publish-beta
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Chreece/HA-Home-Environment-Manager' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Publish exact validated commit and retire older betas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I .github/scripts/publish_release.py
