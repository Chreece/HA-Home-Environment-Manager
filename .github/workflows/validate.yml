      - name: Package and inspect canonical HACS integration
        run: |
          python -I - <<'PY'
          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import subprocess
          from zipfile import ZipFile

          script = Path('.github/scripts/publish_release.py')
          spec = importlib.util.spec_from_file_location('hem_release_publisher', script)
          publisher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(publisher)

          source = Path('custom_components/environment_manager')
          manifest = json.loads((source / 'manifest.json').read_text(encoding='utf-8'))
          hacs = json.loads(Path('hacs.json').read_text(encoding='utf-8'))
          assert manifest['domain'] == 'environment_manager'
          assert hacs['zip_release'] is True and hacs['filename'] == 'environment_manager.zip'
          assert not hacs.get('content_in_root', False)
          # Unit tests use an untracked compatibility symlink; only tracked code ships.
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          assert 'manifest.json' not in tracked and '__init__.py' not in tracked
          version = manifest['version']
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()

          data = publisher.package(Path('.'), sha, version)
          names = publisher.inspect_zip(data, version)
          assert 'manifest.json' in names and '__init__.py' in names
          assert 'translations/el.json' in names
          assert 'frontend/air-quality-advisor-card.js' in names
          assert all(not name.startswith(publisher.SOURCE) for name in names)
          assert all(name.startswith(('translations/', 'frontend/', 'brand/'))
                     or '/' not in name for name in names)

          output = Path('dist') / hacs['filename']
          output.parent.mkdir(exist_ok=True)
          output.write_bytes(data)
          with ZipFile(output) as archive:
              assert archive.testzip() is None
              assert json.loads(archive.read('manifest.json')) == manifest
          print('PASS: Marketplace/HACS release ZIP', version, len(names),
                len(data), hashlib.sha256(data).hexdigest())
          PY
