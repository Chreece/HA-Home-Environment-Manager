name: HEM Beta89 physical activity and automatic ownership

on:
  push:
    branches: ['feat/beta89-physical-activity-automatic-20261102', 'release/v0.6.0b89']
  pull_request:
    branches: ['release/v0.6.0b88']

permissions:
  contents: read

jobs:
  automatic-controller-and-card:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile controller and validate all JSON/JS
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          import json
          from pathlib import Path
          for file in Path('.').rglob('*.json'):
              json.loads(file.read_text(encoding='utf-8'))
          PY
      - name: Preserve automatic/PID and distinguish real physical manual override
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta89_automatic.py
          python -I .github/tests/test_beta85_native_resume.py
          python -I .github/tests/test_beta72_resume_running.py
          python -I .github/tests/test_beta73_restart_power_history.py
          python -I .github/tests/test_beta75_native_supply_recovery.py
          python -I .github/tests/test_beta88_power_startup_and_retries.py
          python -I .github/tests/test_beta83_supply_safety.py
      - name: Install Home Assistant and Chromium test dependencies
        run: python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
      - name: Real browser mobile, controller links and diagnostics regressions
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta85_resume_browser.py
          python -I .github/tests/test_beta86_fault_card.py
          python -I .github/tests/test_beta87_compact_browser.py
          python -I .github/tests/test_beta89_card.py
      - name: Whitespace safety
        run: git diff --check
