name: HEM Beta97 hide external power selector on battery devices

on:
  push:
    branches: ['fix/beta97-hide-battery-power-select-20261103', 'release/v0.6.0b97']
  pull_request:
    branches: ['release/v0.6.0b97']

permissions:
  contents: read

jobs:
  verify-battery-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate syntax, HA power selector and exact source changes
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          assert json.loads(Path('manifest.json').read_text())['version']=='0.6.0b97'
          code=Path('select.py').read_text()
          battery=Path('equipment_battery.py').read_text()
          assert 'battery_reporting_controllers' in code
          assert 'registry.async_get_entity_id(' in code
          assert '"select", DOMAIN, f"{spec.identifier}_power_switch_entity"' in code
          assert 'registry.async_remove(old_selector)' in code
          assert 'def battery_reporting_controllers(' in battery
          print('BETA97_BATTERY_SELECTOR_REGISTRATION_SOURCE_PASS')
          PY
          git fetch --no-tags --depth=1 origin d23299b89eb357ad1e5601b38246b348f8d0b4f2
          python -I - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',
               'd23299b89eb357ad1e5601b38246b348f8d0b4f2','HEAD','--'],
              text=True).splitlines())
          required={
              '.github/releases/v0.6.0b97.md',
              '.github/tests/test_beta97_battery_power_selector.py',
              '.github/workflows/publish-beta97.yml',
              '.github/workflows/verify-beta97-battery.yml',
              'equipment_battery.py',
              'select.py',
              'manifest.json',
          }
          assert changed==required,('BETA97_UNEXPECTED_FILES',
                                    sorted(changed-required),
                                    sorted(required-changed))
          assert not changed.intersection({
             'equipment_runtime.py','equipment_power_switch.py','equipment_window.py',
             'equipment_model.py','climate.py','manager.py','device_controls.py',
             'frontend/air-quality-advisor-card.js','pid_phase.py','pid_restart.py'})
          print('BETA97_HARDWARE_PID_WINDOW_AND_DASHBOARD_UNCHANGED_PASS')
          PY
          git diff --check
      - name: Test actual native HA registration and battery detection
        run: python -I .github/tests/test_beta97_battery_power_selector.py
      - name: Preserve existing battery-independent power and PID safety
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta94_room_windows.py
          python -I .github/tests/test_beta94_dry_automatic.py
          python -I .github/tests/test_beta91_dry_only_pwm.py
          python -I .github/tests/test_beta91_pid_restart.py
          python -I .github/tests/test_beta88_power_startup_and_retries.py
          python -I .github/tests/test_beta74_upstream_dwell.py
          python -I .github/tests/test_beta96_air_sensor_classification.py
      - name: Install HA test harness and Chromium
        run: python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
      - name: Preserve compact mobile cards, native entity links and scroll
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta87_compact_browser.py
          python -I .github/tests/test_beta92_lovelace_scroll.py
          python -I .github/tests/test_beta93_native_entity_links.py
          python -I .github/tests/test_beta95_card.py
