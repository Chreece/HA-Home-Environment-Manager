name: Verify Away mode names and all locale catalogs

on:
  push:
    branches: [fix/beta58-away-profile-number-labels-20261027]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-name-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Execute locale and profile-ID invariants
        run: cd tests && python -m unittest discover -s . -p 'test_beta58_*.py' -v
