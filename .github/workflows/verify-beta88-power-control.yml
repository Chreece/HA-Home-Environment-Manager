name: HEM Beta88 powered native command safety

on:
  push:
    branches: ['fix/beta88-power-wake-onoff-ack-retries-20261102', 'release/v0.6.0b88']
  pull_request:
    branches: ['release/v0.6.0b87']

permissions:
  contents: read

jobs:
  native-actuator-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile HEM Python and validate JSON
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          python -I - <<'PY'
          import json
          from pathlib import Path
          for item in [Path('manifest.json'), Path('strings.json'), *Path('translations').glob('*.json')]:
              json.loads(item.read_text(encoding='utf-8'))
          PY
      - name: Native boot and three-retry regression scenarios
        run: python -I .github/tests/test_beta88_power_startup_and_retries.py
      - name: Preserve native supply and interrupted-command safety tests
        run: |
          set -euo pipefail
          for file in \
            .github/tests/test_beta83_supply_safety.py \
            .github/tests/test_beta75_native_supply_recovery.py \
            .github/tests/test_beta77_offline_supply_resume.py \
            .github/tests/test_beta85_native_resume.py \
            .github/tests/test_beta64_sleep_idle.py; do
              python -I "$file"
          done
      - name: Ensure patch has no whitespace errors
        run: git diff --check
