name: HEM Beta94 room-scoped windows and automatic continuity

on:
  push:
    branches: ['fix/beta94-room-windows-automatic-ownership-20261103', 'release/v0.6.0b94']
  pull_request:
    branches: ['release/v0.6.0b94']

permissions:
  contents: read

jobs:
  verify-native-window-and-pid:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate sources and changed-files allowlist
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          git diff --check
          python -I - <<'PY'
          from pathlib import Path
          import json
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          assert len(list(Path('translations').glob('*.json')))==38
          assert json.loads(Path('manifest.json').read_text())['version']=='0.6.0b94'
          source=Path('equipment_runtime.py').read_text()
          assert '_native_offline_under_owned_supply' in source
          assert 'native_dry_automatic_stop_not_user_override' in source
          assert 'The per-controller live window policy above is authoritative' in source
          assert 'ignored_other_room_contacts' in Path('equipment_window.py').read_text()
          print('BETA94_SOURCE_AUTOMATIC_AND_LOCAL_WINDOWS_CONTRACT=PASS')
          PY
          git fetch --no-tags --depth=1 origin d370a2c77c20f8c99b8f30d43a6687c4acb8b40d
          python -I - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',
            'd370a2c77c20f8c99b8f30d43a6687c4acb8b40d','HEAD','--'],
            text=True).splitlines())
          expected={
            '.github/releases/v0.6.0b94.md',
            '.github/tests/test_beta94_room_windows.py',
            '.github/tests/test_beta94_dry_automatic.py',
            '.github/workflows/publish-beta94.yml',
            '.github/workflows/verify-beta94-auto-room.yml',
            'equipment_window.py',
            'equipment_runtime.py',
            'equipment_power_switch.py',
            'manifest.json',
          }
          assert changed==expected,('BETA94_UNEXPECTED_CHANGES',
                                   sorted(changed-expected),sorted(expected-changed))
          assert 'frontend/air-quality-advisor-card.js' not in changed
          print('BETA94_TOUCHED_FILES_WHITELISTED=PASS')
          PY
      - name: Actual independent room window and AUTO device regressions
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta94_room_windows.py
          python -I .github/tests/test_beta94_dry_automatic.py
          python -I .github/tests/test_beta66_windows.py
          python -I .github/tests/test_beta90_window_evidence.py
          python -I .github/tests/test_beta89_automatic.py
      - name: Preserve physical source, native retry, relay and compressor safety
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta91_dry_only_pwm.py
          python -I .github/tests/test_beta91_pid_restart.py
          python -I .github/tests/test_beta72_resume_running.py
          python -I .github/tests/test_beta73_restart_power_history.py
          python -I .github/tests/test_beta74_upstream_dwell.py
          python -I .github/tests/test_beta75_native_supply_recovery.py
          python -I .github/tests/test_beta77_offline_supply_resume.py
          python -I .github/tests/test_beta83_supply_safety.py
          python -I .github/tests/test_beta85_native_resume.py
          python -I .github/tests/test_beta88_power_startup_and_retries.py
