name: HEM b9 verified settings help
on:
  push:
    branches: [fix/062b9-settings-help]
    paths: [.github/workflows/b9-source.yml]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'Chreece/HA-Home-Environment-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply tested UI-only changes and verify exact contents
        run: |
          set -euo pipefail
          test "$(git hash-object custom_components/environment_manager/frontend/air-quality-advisor-card.js)" = a05f823991e9ea24d2b81bc23a4304aa95372378
          python .github/b9-build.py
          python - <<'PY'
          import subprocess
          expected = {
              'custom_components/environment_manager/frontend/air-quality-advisor-card.js': '2359668ecba47b56a7ceadedcf5efb8d097c5340',
              'custom_components/environment_manager/manifest.json': 'e271e0a8f4cf63e54b7cea153b48acf9fa50fb8a',
              '.github/workflows/validate.yml': '156662157595a799213d734a036af6536375bc8a',
              '.github/releases/v0.6.2b9.md': '86870b33a837b14b54cf6ea0acc1ea82a4bc6f54',
              '.github/tests/test_062b9_settings_help.py': '770f8568c51ba89ec7b5bc18d9c832aa46021660'
          }
          for path, digest in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == digest, (path, actual, digest)
          print('All five changed files match tested source')
          PY
          node --check custom_components/environment_manager/frontend/air-quality-advisor-card.js
          python -I .github/scripts/audit_settings.py --check
          git diff --check
      - name: Record verified changes on fix branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp .github/workflows/validate.yml .github/b9-validated-workflow.txt
          git restore .github/workflows/validate.yml
          git add -u
          git add .github/b9-validated-workflow.txt
          git diff --cached --check
          git commit -m 'Apply tested right-aligned setting help across Home Room Device and Floor menus'
          git push origin HEAD:refs/heads/fix/062b9-settings-help
