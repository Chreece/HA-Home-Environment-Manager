name: HEM b9 source snapshot
on:
  push:
    branches: [fix/062b9-settings-help]
    paths: [.github/workflows/b9-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir /tmp/hem-b9
          git archive --format=tar.gz HEAD > /tmp/hem-b9/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hem-b9-source
          path: /tmp/hem-b9/
          retention-days: 2
