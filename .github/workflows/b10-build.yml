name: Build verified HEM b10 settings update
on:
  push:
    branches: [feat/062b10-settings-completeness]
    paths: [.github/workflows/b10-build.yml, .github/b10-patch.gz.b64]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply checked patch against exact b9 without executing untrusted files
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          payload=Path('.github/b10-patch.gz.b64')
          data=gzip.decompress(base64.b64decode(payload.read_text().strip()))
          assert hashlib.sha256(data).hexdigest()=='88ba03ce6ee25f22a53349122f8471dadd9490987614e76bb1f3d81ac8cd5786'
          patch=Path('/tmp/b10-verified.patch');patch.write_bytes(data)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          expected={"custom_components/environment_manager/frontend/air-quality-advisor-card.js":"c0020bec0c4aa262c0a05342695cb3f318de07c0","custom_components/environment_manager/room_setup.py":"0cb9b98e4aeea646261c51a678a3cb7e602b77a8","custom_components/environment_manager/settings_help.py":"a91df8a7217ca0a0a3e9a203537ed14487e043a1","custom_components/environment_manager/equipment_entity.py":"82e6c2e9f9da435894b2957ce648603954cb53b1","custom_components/environment_manager/strings.json":"3cacbb9e382936a3bda5e2c85663c43b9b919db5","custom_components/environment_manager/translations/en.json":"3f514b242cf081603e24e0169e6d7aa32bef94bb","custom_components/environment_manager/translations/el.json":"91d8a5af660e51a830fe0dd638169863960da465","custom_components/environment_manager/translations/de.json":"247ce0d2cfaf9d8313afeb0374af0c16a6a930b1","docs/settings-inventory.json":"48fd31eae9fd3815602d8b14996373aa3c02a802",".github/tests/test_062b10_settings_completeness.py":"4fbdc617a0318ef4319f87092e1848e72f6b5c4c",".github/tests/test_062b10_source_validation.py":"e80e92686e805aa380ab114f837bc00097c58e70",".github/releases/v0.6.2b10.md":"7e7f0af432abc6d4f9af8d87d100cd35f2891509","custom_components/environment_manager/manifest.json":"ec46cb67b8940f6fe9b087182db725d56839e82e",".github/workflows/validate.yml":"ea191064f68326b3d43ab08f54aa83473b2c0a0d"}
          for path,sha in expected.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==sha,(path,actual,sha)
          print('PASS: exact b9 patch, SHA-256 and',len(expected),'checked source files')
          PY
          git diff --check
          node --check custom_components/environment_manager/frontend/air-quality-advisor-card.js
          python -I -m compileall -q custom_components/environment_manager
      - name: Production source discovery and schema regressions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for child in Path('custom_components/environment_manager').iterdir():
              link=Path(child.name)
              assert not link.exists() and not link.is_symlink(),str(link)
              link.symlink_to(child,target_is_directory=child.is_dir())
          PY
          python -I .github/tests/test_062b10_source_validation.py
          python -I .github/tests/test_beta79_general_form.py
          python -I .github/tests/test_beta120_general_wake.py
          python -I .github/scripts/audit_settings.py --check
          python - <<'PY'
          from pathlib import Path
          for child in Path('custom_components/environment_manager').iterdir():
              link=Path(child.name)
              if link.is_symlink():link.unlink()
          PY
      - name: Record tested source changes on feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp .github/workflows/validate.yml .github/b10-validated-workflow.txt
          git restore .github/workflows/validate.yml
          git rm .github/b10-patch.gz.b64 .github/workflows/b10-build.yml
          git add -u
          git add .github/b10-validated-workflow.txt
          git diff --cached --check
          git commit -m 'HEM b10: preserve menu interactions, source choices and safe configuration'
          git push origin HEAD:refs/heads/feat/062b10-settings-completeness
