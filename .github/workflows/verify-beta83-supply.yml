name: HEM Beta83 upstream power protection

on:
  push:
    branches: ['fix/beta83-upstream-power-verified-idle-20261102']
  pull_request:
    branches: ['feat/beta82-passive-pid-adaptation-20261101']

permissions:
  contents: read

jobs:
  supply-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Python, JSON and frontend validation
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          import json
          from pathlib import Path
          for f in [Path('manifest.json'), Path('strings.json'), *Path('translations').glob('*.json')]:
              json.loads(f.read_text(encoding='utf-8'))
          PY
      - name: New verified idle, 60-second cooldown, ACK race tests
        run: python -I .github/tests/test_beta83_supply_safety.py
      - name: Preserve previous native power, restart and relay dwells
        run: |
          set -euo pipefail
          for f in \
            .github/tests/test_beta64_sleep_idle.py \
            .github/tests/test_beta72_resume_running.py \
            .github/tests/test_beta73_restart_power_history.py \
            .github/tests/test_beta74_upstream_dwell.py \
            .github/tests/test_beta75_native_supply_recovery.py \
            .github/tests/test_beta77_offline_supply_resume.py; do
              python -I "$f"
          done
      - name: Working tree has no whitespace problems
        run: git diff --check
