name: Settings UI workbench
on:
  push:
    branches: [fix/062b2-door-menu-labels]
    paths:
      - .github/workflows/settings-ui-workbench.yml
      - .github/patches/settings-ui-062b2.py
permissions:
  contents: write
concurrency:
  group: settings-ui-workbench
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'Chreece/HA-Home-Environment-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/062b2-door-menu-labels
      - name: Apply reviewed UI-only source transformation when present
        run: |
          set -euo pipefail
          if test -f .github/patches/settings-ui-062b2.py; then
            python .github/patches/settings-ui-062b2.py
            node --check custom_components/environment_manager/frontend/air-quality-advisor-card.js
            git diff --check
            git add custom_components/environment_manager/frontend/air-quality-advisor-card.js
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply dashboard door grouping and concise setting labels'
              git push origin HEAD:fix/062b2-door-menu-labels
            fi
          fi
      - name: Archive source for isolated regression testing
        run: git archive --format=tar.gz -o /tmp/hem-ui-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: hem-ui-source
          path: /tmp/hem-ui-source.tar.gz
          retention-days: 1
