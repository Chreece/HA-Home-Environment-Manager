name: Publish Home Environment Manager beta 77
on:
  push:
    branches: ['release/v0.6.0b77']
permissions:
  contents: write
concurrency:
  group: hem-beta77-release
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate canonical release source and immutable tested implementation
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          from pathlib import Path
          import json
          m=json.loads(Path('manifest.json').read_text())
          assert m['domain']=='environment_manager' and m['version']=='0.6.0b77'
          for p in Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          assert len(list(Path('translations').glob('*.json')))==38
          code=Path('shade_cooling.py').read_text()
          assert code.count('LUX_BOUNDS =')==1
          assert code.count('measured_lux = lux_evidence')==1
          assert 'if new in source:' in Path('.github/scripts/apply_beta69.py').read_text()
          print('PASS: canonical version, localized release, single optional lux implementation')
          PY
          git fetch --no-tags --depth=1 origin 84cdcefc830dd694bc12dab5f607f3d931d0a755
          python -I - <<'PY'
          import subprocess
          from pathlib import Path
          baseline='84cdcefc830dd694bc12dab5f607f3d931d0a755'
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',baseline,'HEAD','--'],text=True).splitlines())
          allowed={
            'manifest.json','frontend/air-quality-advisor-card.js',
            'equipment_model.py','equipment_runtime.py','equipment_power_switch.py'
          }
          forbidden={p for p in changed if not (p in allowed or p.startswith('.github/'))}
          assert not forbidden,forbidden
          assert allowed <= changed,changed
          card=Path('frontend/air-quality-advisor-card.js').read_text()
          assert card.count('HEM_COMPACT76_START')==1
          assert card.count('HEM_COMPACT76_END')==1
          assert 'data-window-policy-switch' in card
          assert "kind==='temperature' && !thermalModes" in card
          runtime=Path('equipment_runtime.py').read_text()
          assert 'upstream_switch_off_native_state_unverified' in runtime
          assert 'not offline and cap is not None' in runtime
          supply=Path('equipment_power_switch.py').read_text()
          assert 'upstream_switch_off_but_native_reports_active' in supply
          print('PASS: Beta76 provenance, bounded Beta77 sources, no unrelated integration changes')
          PY
          git diff --check
      - name: Guarded DRY-only and external-supply OFF recovery regressions
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta77_dry_only_target.py
          python -I .github/tests/test_beta77_offline_supply_resume.py
      - name: Real native reconnection after owned supply ON
        run: python -I .github/tests/test_beta75_native_supply_recovery.py
      - name: Per-device external supply min-ON, min-OFF and cooldown evidence
        run: python -I .github/tests/test_beta74_upstream_dwell.py
      - name: Actual persisted physical ON history and safe restart recovery
        run: python -I .github/tests/test_beta73_restart_power_history.py
      - name: Resume authorized running physical outputs without forcing OFF
        run: python -I .github/tests/test_beta72_resume_running.py
      - name: Restore genuinely closed windows without spurious restart delay
        run: python -I .github/tests/test_beta66_windows.py
      - name: Real PID profile response and physical minimum-OFF regression
        run: python -I .github/tests/test_beta70_pid_profile.py
      - name: Actual per-cover lux controller and existing protective behavior
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta69_shade_lux.py
          python -I .github/tests/test_beta61_supply_selection.py
          python -I .github/tests/test_beta62_pid_races.py
          python -I .github/tests/test_beta63_cold_start.py
          python -I .github/tests/test_beta64_sleep_idle.py
          python -I .github/tests/test_beta65_data.py
          python -I .github/tests/test_beta66_windows.py
          python -I .github/tests/test_beta67_aqi.py
          python -I .github/tests/test_beta68_scheduler.py
          python -I .github/tests/test_beta68_metadata.py
      - name: Install runner-only Home Assistant and browser test packages
        run: python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
      - name: Home Assistant dispatcher and compact card browser interactions
        run: |
          python -I .github/tests/test_beta68_events.py
          python -I .github/tests/test_beta66_browser.py
          python -I .github/tests/test_beta68_browser.py
          python -I .github/tests/test_beta76_compact_browser.py
      - name: Package and inspect canonical HACS integration
        run: |
          python -I - <<'PY'
          import json,subprocess
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          p=Path('dist/HA-Home-Environment-Manager-v0.6.0b77.zip')
          p.parent.mkdir(exist_ok=True)
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with ZipFile(p,'w',ZIP_DEFLATED,compresslevel=8) as z:
              for name in sorted(filter(None,names)):
                  if name.startswith(('.github/','tests/','dist/')) or name=='hacs.json' or '__pycache__' in name or name.endswith(('.pyc','.pyo')):
                      continue
                  q=Path(name)
                  if q.is_file():z.write(q,'custom_components/environment_manager/'+name)
          with ZipFile(p) as z:
              assert z.testzip() is None
              root='custom_components/environment_manager/'
              m=json.loads(z.read(root+'manifest.json'))
              assert m['domain']=='environment_manager' and m['version']=='0.6.0b77'
              for f in ('__init__.py','shade_cooling.py','switch.py','select.py','number.py','device_controls.py','translations/el.json','frontend/air-quality-advisor-card.js'):
                  assert root+f in z.namelist(),f
              assert all(f.startswith(root) for f in z.namelist())
          print('PASS: canonical Beta77 ZIP',p.stat().st_size)
          PY
      - name: Publish verified HACS prerelease at exact branch tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.6.0b77
          current="$(git ls-remote origin refs/heads/release/v0.6.0b77 | cut -f1)"
          test "$current" = "$GITHUB_SHA" || { echo 'Release branch moved during tests'; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists; leaving immutable artifacts unchanged'
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo 'Tag already exists but no release; refusing tag replacement'
            exit 1
          fi
          gh release create "$TAG" "dist/HA-Home-Environment-Manager-$TAG.zip#Manual installation ZIP" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Home Environment Manager $TAG" --notes-file ".github/releases/$TAG.md" --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets,url
