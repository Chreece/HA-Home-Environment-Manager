name: Verify Home Environment Manager beta 108 setpoint feedback
on:
  push:
    branches: ['work/v0.6.0b108']
permissions:
  contents: read
concurrency:
  group: hem-beta108-setpoint-feedback
  cancel-in-progress: true
jobs:
  verify-setpoint-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install browser test dependency
        run: python -m pip install 'playwright==1.57.0'
      - name: Reproduce the heat mode, 18.6 C measurement, 5 C target and 30 C request
        env:
          HEM_TEST_SCREENSHOT_DIR: artifacts/setpoint-feedback
        run: |
          node --check frontend/air-quality-advisor-card.js
          python -I .github/tests/test_beta108_setpoint_feedback_browser.py
      - name: Preserve browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hem-beta108-setpoint-feedback
          path: artifacts/setpoint-feedback
          if-no-files-found: error
          retention-days: 7
