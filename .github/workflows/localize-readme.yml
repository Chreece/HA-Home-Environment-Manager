name: Translate HEM README into supported languages

on:
  push:
    branches:
      - docs/readme-kofi-locales-20261114
    paths:
      - README.md
      - .github/scripts/localize_readme.py
      - .github/tests/test_readme_localizations.py
      - .github/workflows/localize-readme.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hem-readme-localization
  cancel-in-progress: false

jobs:
  translate:
    if: github.repository == 'Chreece/HA-Home-Environment-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify translation code syntax
        run: python -m py_compile .github/scripts/localize_readme.py .github/tests/test_readme_localizations.py
      - name: Translate all supported HEM interface languages
        run: python -u .github/scripts/localize_readme.py
      - name: Validate every README, image, code block and language link
        run: python -I .github/tests/test_readme_localizations.py
      - name: Commit generated documentation to review branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/i18n/README.*.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'docs(i18n): translate HEM README into all 37 other supported locales'
            git push origin HEAD:refs/heads/docs/readme-kofi-locales-20261114
          fi
