name: Door development evidence

on:
  push:
    branches: [feat/062b3-door-context]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source for isolated development verification
        run: git archive --format=tar HEAD -o /tmp/hem-door-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: hem-door-source
          path: /tmp/hem-door-source.tar
          retention-days: 1
          if-no-files-found: error
