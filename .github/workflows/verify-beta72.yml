name: Beta72 Resume running physical equipment without OFF

on:
  push:
    branches:
      - 'fix/beta72-resume-active-native-20261031'

permissions:
  contents: read

jobs:
  resume-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Source syntax, all locales, frontend syntax
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          python -I - <<'PY'
          from pathlib import Path
          import json
          manifest=json.loads(Path('manifest.json').read_text(encoding='utf8'))
          assert manifest['domain']=='environment_manager'
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf8'))
          print('PASS canonical domain, Python and JSON')
          PY
          node --check frontend/air-quality-advisor-card.js
      - name: Actual Resume handler and exact manual-to-PID + power ownership scenarios
        run: python -I .github/tests/test_beta72_resume_running.py
      - name: All previous native, window, sleep, power, AQI and shade regressions
        run: |
          set -euo pipefail
          for script in \
            .github/tests/test_beta61_supply_selection.py \
            .github/tests/test_beta62_pid_races.py \
            .github/tests/test_beta63_cold_start.py \
            .github/tests/test_beta64_sleep_idle.py \
            .github/tests/test_beta65_data.py \
            .github/tests/test_beta66_windows.py \
            .github/tests/test_beta67_aqi.py \
            .github/tests/test_beta68_scheduler.py \
            .github/tests/test_beta68_metadata.py \
            .github/tests/test_beta69_shade_lux.py \
            .github/tests/test_beta70_pid_profile.py; do
            echo "VERIFY $script"
            python -I "$script"
          done
      - name: Actual HA dispatcher and Chromium state-stream load
        run: |
          python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
          python -I .github/tests/test_beta68_events.py
          python -I .github/tests/test_beta68_browser.py
