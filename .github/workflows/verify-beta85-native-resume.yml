name: HEM Beta85 interrupted-native Resume recovery and safety

on:
  push:
    branches: ['fix/beta85-native-resume-reconciliation-20261102']
  pull_request:
    branches: ['release/v0.6.0b84']

permissions:
  contents: read

jobs:
  native-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Python, JSON, and dashboard syntax
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          PY
      - name: Real interrupted native Resume and physical evidence gates
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta85_native_resume.py
          python -I .github/tests/test_beta72_resume_running.py
          python -I .github/tests/test_beta73_restart_power_history.py
          python -I .github/tests/test_beta77_offline_supply_resume.py
      - name: Preserve supply, sleep, PID, notification and UI safety
        run: |
          set -euo pipefail
          for file in \
            .github/tests/test_beta83_supply_safety.py \
            .github/tests/test_beta84_unified_review.py \
            .github/tests/test_beta84_pid_review_runtime.py \
            .github/tests/test_beta82_pid_passive.py \
            .github/tests/test_beta82_runtime_guard.py \
            .github/tests/test_beta74_upstream_dwell.py \
            .github/tests/test_beta75_native_supply_recovery.py \
            .github/tests/test_beta64_sleep_idle.py \
            .github/tests/test_beta70_pid_profile.py \
            .github/tests/test_beta62_pid_races.py \
            .github/tests/test_beta63_cold_start.py \
            .github/tests/test_beta78_room_occupancy.py; do
              python -I "$file"
          done
      - name: Actual HA event stream regression
        run: |
          python -m pip install 'homeassistant==2026.10.4'
          python -I .github/tests/test_beta68_events.py
      - name: Whitespace and patch validation
        run: git diff --check
