name: HEM Beta92 Lovelace scroll-jump regression

on:
  push:
    branches: ['fix/beta92-lovelace-scroll-rescue-20261102', 'release/v0.6.0b92']
  pull_request:
    branches: ['release/v0.6.0b92']

permissions:
  contents: read

jobs:
  verify-dashboard-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate source and frontend-only change guard
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          assert json.loads(Path('manifest.json').read_text())['version']=='0.6.0b92'
          code=Path('frontend/air-quality-advisor-card.js').read_text()
          for symbol in ('HEM_STABLE_DOM91_START','HEM_PAGE_SCROLL92_START',
                         '_commitContent91','_recoverUnexpectedScroll92',
                         '_stableDomUpdates91||0','_hemScrollEpoch90',
                         'requestAnimationFrame'):
              assert symbol in code,symbol
          assert len(list(Path('translations').glob('*.json')))==38
          print('BETA92_FRONTEND_ONLY_SCROLL_RESCUE_CONTRACT=PASS')
          PY
          git fetch --no-tags --depth=1 origin 845f9e1681ea1da079bf640b0d8d394cdd9e1bde
          python -I - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',
            '845f9e1681ea1da079bf640b0d8d394cdd9e1bde','HEAD','--'],text=True).splitlines())
          expected={
            '.github/releases/v0.6.0b92.md',
            '.github/tests/test_beta92_lovelace_scroll.py',
            '.github/workflows/publish-beta92.yml',
            '.github/workflows/verify-beta92-scroll.yml',
            'frontend/air-quality-advisor-card.js',
            'manifest.json',
          }
          assert changed==expected,('BETA92_UNEXPECTED_CHANGES',sorted(changed-expected),
                                      sorted(expected-changed))
          print('PASS: only approved frontend, test, and release metadata changed')
          PY
          git diff --check
      - name: Preserve Beta91 physical safety and humidity control
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta91_dry_only_pwm.py
          python -I .github/tests/test_beta91_pid_restart.py
          python -I .github/tests/test_beta88_power_startup_and_retries.py
          python -I .github/tests/test_beta90_window_evidence.py
      - name: Install Home Assistant and browser regression runner dependencies
        run: python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
      - name: Real Chromium three-column Lovelace page and prior card regressions
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta90_scroll_card.py
          python -I .github/tests/test_beta91_stable_dom.py
          python -I .github/tests/test_beta87_compact_browser.py
          python -I .github/tests/test_beta89_card.py
          python -I .github/tests/test_beta92_lovelace_scroll.py
