name: Apply verified b11 freshness policy
on:
  push:
    branches: [feat/062b11-auto-custom-freshness]
    paths:
      - .github/b11-verified.patch.gz.b64
      - .github/workflows/b11-apply.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Chreece/HA-Home-Environment-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check exact reviewed patch and apply without unrelated changes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,subprocess
          p=Path('.github/b11-verified.patch.gz.b64')
          b=p.read_text().strip()
          assert hashlib.sha256(b.encode()).hexdigest()=='8d94380867999fd2c06df3d2bf0ce6322eb1234265fc74bf26edcd46abb22007'
          raw=gzip.decompress(base64.b64decode(b,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='7ee2ee972a19c648b0cbf7a9df424bdc3b8413494e279403f1315d19a742bdd3'
          subprocess.run(['git','apply','--check','--whitespace=error','-'],input=raw,check=True)
          subprocess.run(['git','apply','--whitespace=error','-'],input=raw,check=True)
          expected={
          'custom_components/environment_manager/freshness_policy.py':'894ec3307d49fb112c39ada3628036fc93313dfe',
          'custom_components/environment_manager/discovery.py':'3d9eab6304a8336ce9be19b86fee603539834bd9',
          'custom_components/environment_manager/manager.py':'a10039a69895605d4b8badf23380aa9930aea841',
          'custom_components/environment_manager/occupancy_policy.py':'f458bc9e331575ecd8111c6d2b3eb313835ab658',
          'custom_components/environment_manager/room_setup.py':'cbca3840efb2fbf4ab6b61f9e06bc2bf99082238',
          'custom_components/environment_manager/frontend/air-quality-advisor-card.js':'f85f7f8fe2959fb12260838c01d70f7762210774',
          'custom_components/environment_manager/manifest.json':'6169f908a1f4c297e528223400ab35a1d6b60780',
          '.github/workflows/validate.yml':'5eee72ccc1a18821357cf709d980b43de66ab3aa',
          '.github/tests/test_062b11_freshness.py':'6302c125b2f5519a89609114e604b25888b6033e',
          '.github/tests/test_062b11_freshness_ui.py':'aaf49dac5a414330c9ca4e673b69fc4e14951755',
          '.github/tests/test_062b11_native_modes.py':'34bf3b8eaba3f9804edb71cdf9596bc651478ef5',
          }
          for path,sha in expected.items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==sha,(path,got,sha)
          print('Exact verified patch applied; every key implementation/test file matches')
          PY
          node --check custom_components/environment_manager/frontend/air-quality-advisor-card.js
          git diff --check
      - name: Run dependency-free freshness and native-mode regressions
        run: |
          python -I .github/tests/test_062b11_freshness.py
          python -I .github/tests/test_062b11_native_modes.py
      - name: Record patch on feature branch, not main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/b11-verified.patch.gz.b64 .github/workflows/b11-apply.yml
          git add -A -- .github custom_components/environment_manager docs/settings-inventory.json
          git diff --cached --check
          git commit -m "Implement Automatic/Custom freshness policy across HEM settings and runtime"
          git push origin HEAD:refs/heads/feat/062b11-auto-custom-freshness
