name: HEM Beta90 compact room, stable scroll and window contact evidence

on:
  push:
    branches: ['fix/beta90-room-summary-scroll-window-evidence-20261102', 'release/v0.6.0b90']
  pull_request:
    branches: ['release/v0.6.0b89']

permissions:
  contents: read

jobs:
  room-scroll-window-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Python, JS and all JSON structure checks
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          from pathlib import Path
          import json
          for f in Path('.').rglob('*.json'):
              json.loads(f.read_text(encoding='utf-8'))
          PY
      - name: Actual native window and registry-evidence safety
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta90_window_evidence.py
          python -I .github/tests/test_beta66_windows.py
          python -I .github/tests/test_beta75_native_supply_recovery.py
          python -I .github/tests/test_beta83_supply_safety.py
          python -I .github/tests/test_beta88_power_startup_and_retries.py
          python -I .github/tests/test_beta89_automatic.py
      - name: Install Home Assistant and Chromium browser test dependencies
        run: python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
      - name: Mobile room layout, sensor limits, scroll stability and native links
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta87_compact_browser.py
          python -I .github/tests/test_beta89_card.py
          python -I .github/tests/test_beta90_scroll_card.py
          python -I .github/tests/test_beta85_resume_browser.py
      - name: Whitespace check
        run: git diff --check
