name: Publish Home Environment Manager beta 88
on:
  push:
    branches: ['release/v0.6.0b88']
permissions:
  contents: write
concurrency:
  group: hem-beta88-release
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate canonical release source and immutable tested implementation
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          from pathlib import Path
          import json
          m=json.loads(Path('manifest.json').read_text())
          assert m['domain']=='environment_manager' and m['version']=='0.6.0b88'
          for p in Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          assert len(list(Path('translations').glob('*.json')))==38
          code=Path('shade_cooling.py').read_text()
          assert code.count('LUX_BOUNDS =')==1
          assert code.count('measured_lux = lux_evidence')==1
          assert 'if new in source:' in Path('.github/scripts/apply_beta69.py').read_text()
          print('PASS: canonical version, localized release, single optional lux implementation')
          PY
          git fetch --no-tags --depth=1 origin ed03e55cb902cc8197d57bef48e396b841f3ecea
          python -I - <<'PY'
          import subprocess,json
          from pathlib import Path
          baseline='ed03e55cb902cc8197d57bef48e396b841f3ecea'
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',baseline,'HEAD','--'],text=True).splitlines())
          required={
              'manifest.json',
              'controller_status_catalog.py',
              'equipment_power_switch.py',
              'equipment_runtime.py',
              'equipment_status.py',
              'strings.json',
              'translations/de.json',
              'translations/el.json',
              'translations/en.json',
              '.github/tests/test_beta63_cold_start.py',
              '.github/tests/test_beta88_power_startup_and_retries.py',
              '.github/workflows/verify-beta88-power-control.yml',
              '.github/workflows/publish-beta88.yml',
              '.github/releases/v0.6.0b88.md',
          }
          assert changed == required, (
              'BETA88_UNEXPECTED_SOURCE_CHANGES',
              sorted(changed-required),sorted(required-changed),
          )
          assert 'sensor.py' not in changed
          assert 'frontend/air-quality-advisor-card.js' not in changed
          runtime=Path('equipment_runtime.py').read_text()
          supply=Path('equipment_power_switch.py').read_text()
          tests=Path('.github/tests/test_beta88_power_startup_and_retries.py').read_text()
          assert 'NATIVE_COMMAND_MAX_ATTEMPTS = 4' in runtime
          assert 'NATIVE_COMMAND_RETRY_SECONDS = 30' in runtime
          assert 'async def _retry_pending(' in runtime
          assert 'UPSTREAM_COMMAND_MAX_ATTEMPTS = 4' in supply
          assert 'async def retry_pending_supply(' in supply
          assert 'native_output_confirmed=False' in supply
          assert 'test_three_retries_before_no_ack_diagnostic' in tests
          assert 'physical_device_startup_timeout' in Path('controller_status_catalog.py').read_text()
          code=Path('frontend/air-quality-advisor-card.js').read_text()
          for marker in (
              'HEM_COMPACT87_START',
              'hem-room-fold87',
              'hem-device-fold87',
              'hem-floating-info87',
              'hem-outside-details87',
              '_compactAfterRender87',
              'showPopover()',
          ):
              assert marker in code, marker
          assert len(list(Path('translations').glob('*.json')))==38
          print('BETA88_POWER_COMMAND_AND_BETA87_UI_INTEGRITY=PASS')
          PY
          git diff --check
      - name: Beta88 actual powered-device startup, binary setpoints and ACK retries
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta88_power_startup_and_retries.py
          python -I .github/tests/test_beta83_supply_safety.py
          python -I .github/tests/test_beta85_native_resume.py
      - name: Beta86 real native HA device errors and complete Hub details
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta86_native_errors.py
          python -I .github/tests/test_beta85_native_resume.py
      - name: Preserve Beta85 guided interrupted-command Resume
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta85_native_resume.py
          python -I .github/tests/test_beta72_resume_running.py
          python -I .github/tests/test_beta73_restart_power_history.py
      - name: Preserve Beta84 unified PID review and upstream power protections
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta84_unified_review.py
          python -I .github/tests/test_beta84_pid_review_runtime.py
          python -I .github/tests/test_beta83_supply_safety.py
          python -I .github/tests/test_beta74_upstream_dwell.py
          python -I .github/tests/test_beta64_sleep_idle.py
      - name: Actual Beta82 menu entrypoints, per-room and consolidated General settings
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta82_pid_passive.py
          python -I .github/tests/test_beta82_runtime_guard.py
          python -I .github/tests/test_beta81_localization.py
          python -I .github/tests/test_beta79_room_reconfigure.py
          python -I .github/tests/test_beta80_menu_init.py
          python -I .github/tests/test_beta79_general_form.py
      - name: Explicit room-list priority and section-based reconfigure tests
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta78_room_occupancy.py
      - name: Guarded DRY-only and external-supply OFF recovery regressions
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta77_dry_only_target.py
          python -I .github/tests/test_beta77_offline_supply_resume.py
      - name: Real native reconnection after owned supply ON
        run: python -I .github/tests/test_beta75_native_supply_recovery.py
      - name: Per-device external supply min-ON, min-OFF and cooldown evidence
        run: python -I .github/tests/test_beta74_upstream_dwell.py
      - name: Actual persisted physical ON history and safe restart recovery
        run: python -I .github/tests/test_beta73_restart_power_history.py
      - name: Resume authorized running physical outputs without forcing OFF
        run: python -I .github/tests/test_beta72_resume_running.py
      - name: Restore genuinely closed windows without spurious restart delay
        run: python -I .github/tests/test_beta66_windows.py
      - name: Real PID profile response and physical minimum-OFF regression
        run: python -I .github/tests/test_beta70_pid_profile.py
      - name: Actual per-cover lux controller and existing protective behavior
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta69_shade_lux.py
          python -I .github/tests/test_beta61_supply_selection.py
          python -I .github/tests/test_beta62_pid_races.py
          python -I .github/tests/test_beta63_cold_start.py
          python -I .github/tests/test_beta64_sleep_idle.py
          python -I .github/tests/test_beta65_data.py
          python -I .github/tests/test_beta66_windows.py
          python -I .github/tests/test_beta67_aqi.py
          python -I .github/tests/test_beta68_scheduler.py
          python -I .github/tests/test_beta68_metadata.py
      - name: Install runner-only Home Assistant and browser test packages
        run: python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
      - name: Home Assistant dispatcher and compact card browser interactions
        run: |
          python -I .github/tests/test_beta68_events.py
          python -I .github/tests/test_beta66_browser.py
          python -I .github/tests/test_beta68_browser.py
          python -I .github/tests/test_beta76_compact_browser.py
          python -I .github/tests/test_beta84_review_browser.py
          python -I .github/tests/test_beta85_resume_browser.py
          python -I .github/tests/test_beta86_fault_card.py
          python -I .github/tests/test_beta87_compact_browser.py
      - name: Package and inspect canonical HACS integration
        run: |
          python -I - <<'PY'
          import json,subprocess
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          p=Path('dist/HA-Home-Environment-Manager-v0.6.0b88.zip')
          p.parent.mkdir(exist_ok=True)
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with ZipFile(p,'w',ZIP_DEFLATED,compresslevel=8) as z:
              for name in sorted(filter(None,names)):
                  if name.startswith(('.github/','tests/','dist/')) or name=='hacs.json' or '__pycache__' in name or name.endswith(('.pyc','.pyo')):
                      continue
                  q=Path(name)
                  if q.is_file():z.write(q,'custom_components/environment_manager/'+name)
          with ZipFile(p) as z:
              assert z.testzip() is None
              root='custom_components/environment_manager/'
              m=json.loads(z.read(root+'manifest.json'))
              assert m['domain']=='environment_manager' and m['version']=='0.6.0b88'
              for f in ('__init__.py','device_faults.py','equipment_resume.py','pid_review.py','equipment_power_switch.py',
                        'pid_passive.py','pid_calibration.py',
                        'equipment_runtime.py','shade_cooling.py','switch.py',
                        'select.py','number.py','device_controls.py',
                        'translations/el.json','frontend/air-quality-advisor-card.js'):
                  assert root+f in z.namelist(),f
              assert all(f.startswith(root) for f in z.namelist())
          print('PASS: canonical Beta88 ZIP',p.stat().st_size)
          PY
      - name: Publish verified HACS prerelease at exact branch tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.6.0b88
          current="$(git ls-remote origin refs/heads/release/v0.6.0b88 | cut -f1)"
          test "$current" = "$GITHUB_SHA" || { echo 'Release branch moved during tests'; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists; leaving immutable artifacts unchanged'
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo 'Tag already exists but no release; refusing tag replacement'
            exit 1
          fi
          gh release create "$TAG" "dist/HA-Home-Environment-Manager-$TAG.zip#Manual installation ZIP" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Home Environment Manager $TAG" --notes-file ".github/releases/$TAG.md" --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets,url
