name: HEM Beta99 startup readiness and native manual evidence

on:
  push:
    branches: ['fix/beta99-startup-native-recovery-20261103', 'release/v0.6.0b99']
  pull_request:
    branches: ['release/v0.6.0b99']

permissions:
  contents: read

jobs:
  verify-startup-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate source, safety contract and exact changed-file scope
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          import json
          from pathlib import Path
          for f in Path('.').rglob('*.json'):
              json.loads(f.read_text(encoding='utf-8'))
          assert json.loads(Path('manifest.json').read_text())['version']=='0.6.0b99'
          src=Path('equipment_runtime.py').read_text()
          for marker in (
              'HA_READY_COOLDOWN_SECONDS = 60',
              'NATIVE_STARTUP_STABLE_SECONDS = 60',
              'def _startup_readiness(',
              'automatic_restart_reconciliation',
              'automatic_reconciliation_observing_native_state',
              'unattributed_native_change_not_manual',
              'native_off_confirmed_after_restart',
              'physical_manual_override',
              'NATIVE_COMMAND_MAX_ATTEMPTS = 4',
              'NATIVE_RECONNECT_EXTRA_ATTEMPTS = 2',
          ):
              assert marker in src,marker
          assert 'self.ventilation.observe(' in Path('manager.py').read_text()
          assert 'ignored_other_room_contacts' in Path('equipment_window.py').read_text()
          print('BETA99_HA_READY_AND_VERIFIED_NATIVE_RECONCILIATION_SOURCE_PASS')
          PY
          git fetch --no-tags --depth=1 origin bf1b01535eed43d3dcf979ecceea02b5b801005d
          python -I - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',
               'bf1b01535eed43d3dcf979ecceea02b5b801005d','HEAD','--'],
              text=True).splitlines())
          allowed={
              '.github/releases/v0.6.0b99.md',
              '.github/tests/test_beta73_restart_power_history.py',
              '.github/tests/test_beta89_automatic.py',
              '.github/tests/test_beta94_dry_automatic.py',
              '.github/tests/test_beta98_nonblocking_ack.py',
              '.github/tests/test_beta98_native_reconnect.py',
              '.github/tests/test_beta99_startup_auto_recovery.py',
              '.github/workflows/publish-beta99.yml',
              '.github/workflows/verify-beta99-startup.yml',
              'equipment_runtime.py','manifest.json',
          }
          assert changed==allowed,('BETA99_UNEXPECTED_FILES',
              sorted(changed-allowed),sorted(allowed-changed))
          assert not changed.intersection({
              'equipment_power_switch.py','equipment_window.py',
              'button.py','manager.py','frontend/air-quality-advisor-card.js',
              'equipment_model.py','device_hierarchy.py',
              'pid_phase.py','pid_restart.py'})
          print('BETA99_NO_NEW_PHYSICAL_COMMAND_OR_DASHBOARD_CHANGES=PASS')
          PY
          git diff --check
      - name: Recover interrupted commands and differentiate actual user edits
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta99_startup_auto_recovery.py
          python -I .github/tests/test_beta73_restart_power_history.py
          python -I .github/tests/test_beta89_automatic.py
          python -I .github/tests/test_beta94_dry_automatic.py
          python -I .github/tests/test_beta85_native_resume.py
          python -I .github/tests/test_beta98_nonblocking_ack.py
          python -I .github/tests/test_beta98_native_reconnect.py
      - name: Preserve native retries, PID, DRY compressor, windows and supply
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta61_supply_selection.py
          python -I .github/tests/test_beta88_power_startup_and_retries.py
          python -I .github/tests/test_beta91_dry_only_pwm.py
          python -I .github/tests/test_beta91_pid_restart.py
          python -I .github/tests/test_beta94_room_windows.py
          python -I .github/tests/test_beta74_upstream_dwell.py
          python -I .github/tests/test_beta83_supply_safety.py
      - name: Install Home Assistant and Chromium test libraries
        run: python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
      - name: Preserve compact mobile UI, native identity links and recovery
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta87_compact_browser.py
          python -I .github/tests/test_beta89_card.py
          python -I .github/tests/test_beta92_lovelace_scroll.py
          python -I .github/tests/test_beta93_native_entity_links.py
          python -I .github/tests/test_beta95_card.py
          python -I .github/tests/test_beta98_resume_card.py
