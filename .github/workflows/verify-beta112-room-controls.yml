name: Verify HEM beta 112 room controls and activity colours
on:
  push:
    branches: ['work/v0.6.0b112']
permissions:
  contents: read
concurrency:
  group: hem-beta112-room-controls
  cancel-in-progress: true
jobs:
  room-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install browser test dependency
        run: python -m pip install 'playwright==1.57.0'
      - name: Check reported activity colours and compact room layout
        env:
          HEM_TEST_SCREENSHOT_DIR: artifacts/room-activity
        run: |
          node --check frontend/air-quality-advisor-card.js
          python -I .github/tests/test_beta112_room_activity.py
          python -I .github/tests/test_beta107_room_metrics.py
      - name: Preserve browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hem-beta112-room-activity
          path: artifacts/room-activity
          if-no-files-found: error
          retention-days: 7
