name: Beta68 restored features and bounded update verification
on:
  push:
    branches: ['fix/beta68-feature-stability-20261028']
    paths-ignore: ['.github/workflows/source-beta68.yml']
permissions:
  contents: write
concurrency:
  group: hem-beta68-verification
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Restore immutable Beta66 feature implementation onto Beta67 and apply reviewed stability fixes
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin ad16346883251683b379611763eed5ff1c24ca83
          mkdir -p "$RUNNER_TEMP/hem-beta66" dist
          git archive ad16346883251683b379611763eed5ff1c24ca83 | tar -xf - -C "$RUNNER_TEMP/hem-beta66"
          python -I .github/scripts/build_beta68.py "$RUNNER_TEMP/hem-beta66"
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
      - name: Established supply, PID, sleep, optional inputs and AQI protections
        run: |
          set -euo pipefail
          for test in 61_supply_selection 62_pid_races 63_cold_start 64_sleep_idle 65_data 66_windows 67_aqi; do
            python -I ".github/tests/test_beta${test}.py"
          done | tee dist/previous-regressions.log
      - name: High-volume controller and scheduler update tests
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta68_events.py | tee dist/update-load.log
          python -I .github/tests/test_beta68_scheduler.py | tee dist/source-bursts.log
      - name: Install real Home Assistant and browser test dependencies on runner only
        run: python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
      - name: Actual Home Assistant dispatcher, indexed state events and unload cleanup
        run: |
          set -euo pipefail
          timeout 90 python -I .github/tests/test_beta68_events.py --real-ha | tee dist/real-ha-events.log
      - name: Full Chromium render and rapid-state stream with 5000 entities
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta65_browser.py
          python -I .github/tests/test_beta68_browser.py | tee dist/browser-load.log
      - name: Validate all locale catalogs and metadata
        run: |
          python -I - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          assert m['domain']=='environment_manager' and m['version']=='0.6.0b68'
          files=list(Path('translations').glob('*.json'));assert len(files)==38
          for path in Path('.').rglob('*.json'):json.loads(path.read_text())
          for path in files:
              d=json.loads(path.read_text())
              assert 'equipment_pause_on_window_open' in d['entity']['switch']
          print('PASS canonical identity and 38 translated window controls')
          PY
          git diff --check
      - name: Commit tested generated source only without concurrent overwrite
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$current" = "$GITHUB_SHA" || { echo 'Source branch changed; refusing stale commit'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.py' frontend/air-quality-advisor-card.js manifest.json strings.json translations .github/patches/equipment_window66.py .github/patches/card66.tsv .github/patches/card66.js .github/tests/test_beta64_sleep_idle.py .github/tests/test_beta66_windows.py .github/tests/test_beta66_browser.py
          git commit -m 'Beta68: restore all Beta66 features with bounded updates; keep Beta67 AQI'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > dist/validated-commit.txt
          git archive HEAD > dist/validated-source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta68-test-evidence
          path: dist/
          retention-days: 7
