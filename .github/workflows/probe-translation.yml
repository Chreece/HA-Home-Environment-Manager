name: Probe documentation translation providers

on:
  push:
    branches: [docs/readme-kofi-locales-20261114]
    paths: [.github/workflows/probe-translation.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test availability of public translation and open models
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, urllib.error
          endpoints = {
              "google_short": "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=el&dt=t&q=Hello%20world",
              "google_web": "https://translate.google.com/translate_a/single?client=gtx&sl=en&tl=el&dt=t&q=Hello%20world",
              "mymemory": "https://api.mymemory.translated.net/get?q=Hello%20world&langpair=en%7Cel",
              "lingva": "https://lingva.ml/api/v1/en/el/Hello%20world",
              "libre": "https://translate.argosopentech.com/languages",
              "huggingface_model": "https://huggingface.co/facebook/m2m100_418M/resolve/main/config.json",
          }
          for name, url in endpoints.items():
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      print(name, response.status, response.read(120).decode('utf-8','replace'),flush=True)
              except Exception as err:
                  print(name, type(err).__name__, str(err)[:160],flush=True)
          print("Testing query lengths",flush=True)
          for n in (200, 700, 1400, 2100, 2900, 3500):
              phrase=("Environmental monitoring, humidity, climate control. " * 85)[:n]
              url = "https://translate.googleapis.com/translate_a/single?" + urllib.parse.urlencode(
                  {"client":"gtx","sl":"en","tl":"el","dt":"t","q":phrase})
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"}), timeout=12) as response:
                      print("size",n,"status",response.status,flush=True)
              except urllib.error.HTTPError as err:
                  print("size",n,"error",err.code,flush=True)
              except Exception as err:
                  print("size",n,type(err).__name__,str(err)[:60],flush=True)
          body=urllib.parse.urlencode({"client":"gtx","sl":"en","tl":"el","dt":"t","q":"An automatic home ventilation controller. "*100}).encode()
          try:
              req=urllib.request.Request("https://translate.googleapis.com/translate_a/single",data=body,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=12) as response:
                  print("post",response.status,response.read(80),flush=True)
          except Exception as err:
              print("post",type(err).__name__,str(err)[:100],flush=True)
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("hem_i18n", ".github/scripts/localize_readme.py")
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          readme=Path("README.md").read_text(encoding="utf-8")
          _,units=module.build_units(module.NAV_PATTERN.sub("",readme))
          batch=[]; size=0
          for item in units:
              n=len(item[1])+16
              if batch and size+n>2900: break
              batch.append(item);size+=n
          q="\n".join(f"🟪{idx:04d}🟪 {unit}" for idx,unit,extra in batch)
          print("real_batch",len(batch),"text_chars",len(q),"url_chars",len(urllib.parse.urlencode({"client":"gtx","sl":"en","tl":"el","dt":"t","q":q})),flush=True)
          for mode in ("GET","POST"):
              data=urllib.parse.urlencode({"client":"gtx","sl":"en","tl":"el","dt":"t","q":q}).encode()
              addr="https://translate.googleapis.com/translate_a/single"
              req=urllib.request.Request(addr+"?"+data.decode() if mode=="GET" else addr,
                 data=None if mode=="GET" else data,headers={"User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req,timeout=15) as resp:
                      body=resp.read(200000).decode('utf-8')
                  import json
                  segments="".join(row[0] or "" for row in json.loads(body)[0])
                  print("real_batch",mode,"status",resp.status,"markers",len(module.BATCH_MARKER.findall(segments)),flush=True)
              except urllib.error.HTTPError as err:
                  print("real_batch",mode,"http_error",err.code,flush=True)
              except Exception as err:
                  print("real_batch",mode,type(err).__name__,str(err)[:120],flush=True)
          PY
