name: Beta64 sleep Pause means OFF; device idle and upstream cooldown regressions

on:
  push:
    branches:
      - 'fix/beta64-sleep-off-idle-cooldown-20261027'

permissions:
  contents: read

jobs:
  safe-sleep-and-idle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Canonical domain, source, JSON, frontend check
        shell: bash
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          python -I - <<'PY'
          from pathlib import Path
          import json
          meta = json.loads(Path("manifest.json").read_text())
          assert meta["domain"] == "environment_manager"
          for p in Path(".").rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
          print("PASS: canonical domain, all Python/JSON")
          PY
          node --check frontend/air-quality-advisor-card.js
      - name: Execute real sleep, idle shutdown, physical cooldown and race gates
        run: python -I .github/tests/test_beta64_sleep_idle.py
      - name: Previously released Beta63 cold-start and powered UI
        run: python -I .github/tests/test_beta63_cold_start.py
      - name: Beta61 ON-OFF-unavailable pairing invariants
        run: python -I .github/tests/test_beta61_supply_selection.py
      - name: Beta62 PID and window invariants
        run: python -I .github/tests/test_beta62_pid_races.py
