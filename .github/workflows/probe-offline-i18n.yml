name: Probe offline multilingual README translation
on:
  push:
    branches: [docs/readme-kofi-locales-20261114]
    paths: [.github/workflows/probe-offline-i18n.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight CPU translation dependencies
        run: python -m pip install -q 'ctranslate2>=4.4,<5' 'sentencepiece>=0.2,<1' 'huggingface_hub>=0.32,<2' hf_xet
      - name: Download quantized offline multilingual model and test languages
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import ctranslate2, sentencepiece as spm, time
          t0=time.monotonic()
          repo="luigi000/nllb-200-distilled-600M-ct2-int8"
          root=Path(snapshot_download(repo_id=repo,allow_patterns=[
              "*.bin","config.json","*vocabulary.json","sentencepiece.bpe.model"
          ]))
          print("Files",[(p.name,p.stat().st_size) for p in root.rglob("*") if p.is_file()],flush=True)
          sp=spm.SentencePieceProcessor(model_file=str(root/"sentencepiece.bpe.model"))
          mt=ctranslate2.Translator(str(root),device="cpu",compute_type="int8",
                                  inter_threads=1,intra_threads=2)
          for language in ["ell_Grek","deu_Latn","arb_Arab","zho_Hant","srp_Cyrl"]:
              tokens=["eng_Latn"] + sp.encode("Your whole home's environment, in one Home Assistant card.",out_type=str) + ["</s>"]
              result=mt.translate_batch([tokens],target_prefix=[[language]],beam_size=2,max_decoding_length=90)
              print(language,sp.decode([p for p in result[0].hypotheses[0] if p not in [language,"</s>"]]),flush=True)
          print("TOTAL seconds",round(time.monotonic()-t0,2),flush=True)
          PY
