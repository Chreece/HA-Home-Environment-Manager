name: HEM Beta95 room air refresh and window-temperature advice

on:
  push:
    branches: ['fix/beta95-room-air-refresh-window-energy-20261103', 'release/v0.6.0b95']
  pull_request:
    branches: ['release/v0.6.0b95']

permissions:
  contents: read

jobs:
  verify-room-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate release scope and source syntax
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          import json
          from pathlib import Path
          for file in Path('.').rglob('*.json'):
              json.loads(file.read_text(encoding='utf-8'))
          assert len(list(Path('translations').glob('*.json')))==38
          assert json.loads(Path('manifest.json').read_text())['version']=='0.6.0b95'
          monitor=Path('room_ventilation.py').read_text()
          manager=Path('manager.py').read_text()
          frontend=Path('frontend/air-quality-advisor-card.js').read_text()
          assert 'RoomVentilationMonitor' in monitor and 'thermal_targets' in monitor
          assert 'self.ventilation.observe(' in manager
          assert 'self.ventilation.acknowledge(' in manager
          assert 'hem-room-ventilation95' in frontend
          assert 'data-open-controller89' in frontend
          print('BETA95_ADVISORY_ONLY_ROOM_MONITOR_SOURCE_PASS')
          PY
          git fetch --no-tags --depth=1 origin 503742f512eec0c931b16c28ea8dc51b5fd13c51
          python -I - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',
            '503742f512eec0c931b16c28ea8dc51b5fd13c51','HEAD','--'],
            text=True).splitlines())
          expected={
            '.github/releases/v0.6.0b95.md',
            '.github/tests/test_beta95_room_ventilation.py',
            '.github/tests/test_beta95_messages.py',
            '.github/tests/test_beta95_card.py',
            '.github/workflows/publish-beta95.yml',
            '.github/workflows/verify-beta95-room-ventilation.yml',
            'room_ventilation.py',
            'manager.py',
            'messages.py',
            'frontend/air-quality-advisor-card.js',
            'manifest.json',
          }
          assert changed==expected,('BETA95_UNEXPECTED_FILES',
                                    sorted(changed-expected),sorted(expected-changed))
          assert not ({'equipment_runtime.py','equipment_window.py',
                       'equipment_power_switch.py','pid_phase.py',
                       'pid_restart.py','climate.py'} & changed)
          print('BETA95_EXISTING_PHYSICAL_CONTROLLERS_UNCHANGED_PASS')
          PY
          git diff --check
      - name: Event timing, no fake AQ metrics, thermal trend and language tests
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta95_room_ventilation.py
          python -I .github/tests/test_beta95_messages.py
      - name: Preserve current automatic room-window and hardware interlocks
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta94_room_windows.py
          python -I .github/tests/test_beta94_dry_automatic.py
          python -I .github/tests/test_beta66_windows.py
          python -I .github/tests/test_beta90_window_evidence.py
          python -I .github/tests/test_beta91_dry_only_pwm.py
          python -I .github/tests/test_beta91_pid_restart.py
          python -I .github/tests/test_beta88_power_startup_and_retries.py
          python -I .github/tests/test_beta74_upstream_dwell.py
      - name: Install Home Assistant and Chromium
        run: python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
      - name: Original compact/mobile rendering, native links and ventilation hints
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta87_compact_browser.py
          python -I .github/tests/test_beta90_scroll_card.py
          python -I .github/tests/test_beta91_stable_dom.py
          python -I .github/tests/test_beta92_lovelace_scroll.py
          python -I .github/tests/test_beta93_native_entity_links.py
          python -I .github/tests/test_beta95_card.py
