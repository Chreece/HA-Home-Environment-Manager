name: HEM b7 source verification snapshot
on:
  push:
    branches: [feat/062b7-card-settings-autosave]
    paths: [.github/workflows/b7-build.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'Chreece/HA-Home-Environment-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p /tmp/hem-b7
          git archive --format=tar.gz HEAD > /tmp/hem-b7/source.tar.gz
          git rev-parse HEAD > /tmp/hem-b7/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hem-b7-source
          path: /tmp/hem-b7/
          retention-days: 3
