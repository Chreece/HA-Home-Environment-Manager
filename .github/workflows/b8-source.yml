name: HEM b8 verified settings audit
on:
  push:
    branches: [feat/062b8-settings-audit]
    paths: [.github/workflows/b8-source.yml]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'Chreece/HA-Home-Environment-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply reviewed presentation-only changes and verify hashes
        run: |
          set -euo pipefail
          python .github/b8-build.py
          node --check custom_components/environment_manager/frontend/air-quality-advisor-card.js
          python -I .github/scripts/audit_settings.py --check
          git diff --check
      - name: Record exact source on feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp .github/workflows/validate.yml .github/b8-validated-workflow.txt
          git restore .github/workflows/validate.yml
          git add -u
          git add docs/settings-inventory.json .github/b8-validated-workflow.txt
          git diff --cached --check
          git commit -m 'Apply source-verified settings search, Advanced view and exact duplicate aliases'
          git push origin HEAD:refs/heads/feat/062b8-settings-audit
