name: Stage HEM b10 audited settings fixes
on:
  push:
    branches: [dev]
    paths: [.github/workflows/b10-staging.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'Chreece/HA-Home-Environment-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover pinned source patch and verify digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, base64, gzip, hashlib, urllib.request
          from pathlib import Path
          sha = 'd9b3ed1c747b824ef96d1989045d4aa4d6edc89a'
          endpoint = 'https://api.github.com/repos/Chreece/HA-Home-Environment-Manager/git/blobs/' + sha
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(endpoint, headers=headers), timeout=30) as stream:
              response = json.load(stream)
          encoded = base64.b64decode(response['content'].replace('\n',''))
          assert hashlib.sha1(b'blob '+str(len(encoded)).encode()+b'\0'+encoded).hexdigest() == sha, 'Git blob mismatch'
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '7745dc0c0f6f2afe9e51a6cecb89aaf4236b2c421ba3290c2e3761c5f1854f26'
          Path('/tmp/hem-b10-reviewed.patch').write_bytes(patch)
          print('Verified exact reviewed patch:', len(patch), 'bytes')
          PY
      - name: Apply and check source
        run: |
          set -euo pipefail
          test "$(git hash-object custom_components/environment_manager/frontend/air-quality-advisor-card.js)" = 2359668ecba47b56a7ceadedcf5efb8d097c5340
          test "$(git hash-object custom_components/environment_manager/room_setup.py)" = 9b09366054650f32d77a0af9b397446f04b3f670
          # The recovered b9 source snapshot had stale manifest and CI metadata.
          # Apply all production/translation/test changes unchanged, then
          # rebase those two metadata paths onto the verified current dev.
          git apply --check --exclude=.github/workflows/validate.yml --exclude=custom_components/environment_manager/manifest.json /tmp/hem-b10-reviewed.patch
          git apply --exclude=.github/workflows/validate.yml --exclude=custom_components/environment_manager/manifest.json /tmp/hem-b10-reviewed.patch
          python - <<'PY'
          from pathlib import Path
          manifest = Path('custom_components/environment_manager/manifest.json')
          value = manifest.read_text()
          assert value.count('"version": "0.6.2b9"') == 1
          manifest.write_text(value.replace('"version": "0.6.2b9"', '"version": "0.6.2b10"'))
          workflow = Path('.github/workflows/validate.yml')
          source = workflow.read_text()
          anchor = '      - name: B9 on-demand setting help in every menu\n'
          assert source.count(anchor) == 1 and 'B10 stable settings UI' not in source
          addition = ('      - name: B10 stable settings UI, source selection and safe room changes\n'
                      '        run: |\n'
                      '          python -I .github/tests/test_062b10_settings_completeness.py\n'
                      '          python -I .github/tests/test_062b10_source_validation.py\n')
          workflow.write_text(source.replace(anchor, addition + anchor))
          PY
          node --check custom_components/environment_manager/frontend/air-quality-advisor-card.js
          python -m compileall -q custom_components/environment_manager
          python -I .github/scripts/audit_settings.py --check
          python -I .github/tests/test_beta79_general_form.py
          python -I .github/tests/test_062b10_source_validation.py
          git diff --check
      - name: Commit reviewed source on dev and discard temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/b10-staging.yml
          git add -u
          git add .github/releases/v0.6.2b10.md .github/tests/test_062b10_settings_completeness.py .github/tests/test_062b10_source_validation.py
          git diff --cached --check
          git commit -m 'HEM v0.6.2b10: fix menu interaction races and complete supported settings paths'
          git push origin HEAD:refs/heads/dev
