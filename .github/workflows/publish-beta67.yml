name: Publish Home Environment Manager beta 67 recovery
on:
  push:
    branches: ['release/v0.6.0b67']
permissions:
  contents: write
concurrency:
  group: home-environment-manager-beta67-release
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify canonical manifest and all source syntax
        run: |
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          assert m['domain']=='environment_manager' and m['version']=='0.6.0b67'
          for p in Path('.').rglob('*.json'):json.loads(p.read_text(encoding='utf-8'))
          assert len(list(Path('translations').glob('*.json')))==38
          PY
      - name: Test actual AQI registration, WAQI identification, manual overrides and bounded update load
        run: python -I .github/tests/test_beta67_aqi.py
      - name: Retain earlier supply, cold-start, PID, sleep, warning and lux behavior
        run: |
          set -euo pipefail
          for test in test_beta61_supply_selection.py test_beta62_pid_races.py test_beta63_cold_start.py test_beta64_sleep_idle.py test_beta65_data.py; do
            python -I .github/tests/$test
          done
      - name: Browser tester on CI only
        run: python -m pip install playwright==1.57.0
      - name: Test recovered dashboard in Chromium
        run: python -I .github/tests/test_beta65_browser.py
      - name: Prove rollback baseline and ensure tests did not modify source
        run: |
          git fetch --no-tags --depth=1 origin 96936bf590774355f83eeaaebe120f8153af2c41
          git diff --exit-code 96936bf590774355f83eeaaebe120f8153af2c41 -- equipment_runtime.py equipment_power_switch.py equipment_model.py equipment_entity.py equipment_status.py switch.py climate.py climate_pid.py occupancy_policy.py device_activation.py shade_cooling.py frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          import subprocess
          from pathlib import Path
          before=subprocess.check_output(['git','show','96936bf590774355f83eeaaebe120f8153af2c41:manager.py']).decode()
          assert Path('manager.py').read_text()==before.replace('global_aqi(item, environment_global)','global_aqi(item, environment_global, hass=self.hass)')
          assert not Path('equipment_window.py').exists()
          assert 'HEM_CARD66_START' not in Path('frontend/air-quality-advisor-card.js').read_text()
          print('PASS physical controller and browser interaction rollback; manager only changed AQI evidence call')
          PY
          git diff --exit-code
          git diff --check
      - name: Package exact tested source under canonical integration folder
        run: |
          python -I - <<'PY'
          import json,subprocess
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          archive=Path('dist/HA-Home-Environment-Manager-v0.6.0b67.zip')
          archive.parent.mkdir(exist_ok=True)
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with ZipFile(archive,'w',ZIP_DEFLATED,compresslevel=8) as z:
              for name in sorted(filter(None,names)):
                  if name.startswith(('.github/','tests/','dist/')) or name=='hacs.json' or '__pycache__' in name or name.endswith(('.pyc','.pyo')):
                      continue
                  path=Path(name)
                  if path.is_file():z.write(path,'custom_components/environment_manager/'+name)
          with ZipFile(archive) as z:
              assert z.testzip() is None
              prefix='custom_components/environment_manager/'
              m=json.loads(z.read(prefix+'manifest.json'))
              assert m['domain']=='environment_manager' and m['version']=='0.6.0b67'
              for name in ('__init__.py','aqi_sources.py','aqi_names.py','select.py','number.py','compact_options.py','equipment_runtime.py','frontend/air-quality-advisor-card.js','translations/el.json','strings.json'):
                  assert prefix+name in z.namelist(),name
              assert all(name.startswith(prefix) for name in z.namelist())
              assert prefix+'equipment_window.py' not in z.namelist()
          print('PASS canonical recovery ZIP',archive,archive.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: beta67-recovery-installation
          path: dist/HA-Home-Environment-Manager-v0.6.0b67.zip
          retention-days: 7
      - name: Publish verified HACS prerelease without replacing existing tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.6.0b67
          current="$(git ls-remote origin refs/heads/release/v0.6.0b67 | cut -f1)"
          test "$current" = "$GITHUB_SHA" || { echo 'Release branch moved during validation'; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; leaving unchanged'
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo 'Tag already exists without release; refusing to repoint'
            exit 1
          fi
          gh release create "$TAG" "dist/HA-Home-Environment-Manager-$TAG.zip#Manual installation ZIP" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Home Environment Manager $TAG - recovery and AQI" --notes-file ".github/releases/$TAG.md" --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets,url
