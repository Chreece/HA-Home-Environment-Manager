name: HEM Beta86 native fault monitoring, card and announcements

on:
  push:
    branches: ['feat/beta86-native-device-error-announcements-20261102']
  pull_request:
    branches: ['release/v0.6.0b85']

permissions:
  contents: read

jobs:
  verify-device-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate Python, JSON, and frontend syntax
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          import json
          from pathlib import Path
          for file in Path('.').rglob('*.json'):
              json.loads(file.read_text(encoding='utf-8'))
          PY
      - name: Actual physical HA fault monitoring, dedup and default-ON switch
        run: python -I .github/tests/test_beta86_native_errors.py
      - name: Preserve all previous safety protections
        run: |
          set -euo pipefail
          for file in \
            .github/tests/test_beta85_native_resume.py \
            .github/tests/test_beta83_supply_safety.py \
            .github/tests/test_beta84_unified_review.py \
            .github/tests/test_beta84_pid_review_runtime.py \
            .github/tests/test_beta82_pid_passive.py \
            .github/tests/test_beta82_runtime_guard.py \
            .github/tests/test_beta75_native_supply_recovery.py \
            .github/tests/test_beta74_upstream_dwell.py \
            .github/tests/test_beta73_restart_power_history.py \
            .github/tests/test_beta72_resume_running.py \
            .github/tests/test_beta64_sleep_idle.py \
            .github/tests/test_beta65_data.py \
            .github/tests/test_beta78_room_occupancy.py; do
            python -I "$file"
          done
      - name: Real Chromium original HA error and per-device switch
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.57.0'
          python -I .github/tests/test_beta86_fault_card.py
          python -I .github/tests/test_beta84_review_browser.py
      - name: HA events and frontend code
        run: |
          python -m pip install 'homeassistant==2026.10.4'
          python -I .github/tests/test_beta68_events.py
      - name: No whitespace errors
        run: git diff --check
