name: HEM Beta98 nonblocking preferences and reconnect recovery

on:
  push:
    branches: ['fix/beta98-nonblocking-settings-auto-recovery-20261103', 'release/v0.6.0b98']
  pull_request:
    branches: ['release/v0.6.0b98']

permissions:
  contents: read

jobs:
  verify-safe-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check Python, JavaScript, JSON and protective source scope
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          node --check frontend/air-quality-advisor-card.js
          python -I - <<'PY'
          import json
          from pathlib import Path
          for f in Path('.').rglob('*.json'):
              json.loads(f.read_text(encoding='utf-8'))
          assert json.loads(Path('manifest.json').read_text())['version']=='0.6.0b98'
          runtime=Path('equipment_runtime.py').read_text()
          for marker in (
              'NATIVE_COMMAND_MAX_ATTEMPTS = 4',
              'NATIVE_COMMAND_RETRY_SECONDS = 30',
              'NATIVE_RECONNECT_SETTLE_SECONDS = 30',
              'NATIVE_RECONNECT_EXTRA_ATTEMPTS = 2',
              'async def _retry_after_verified_reconnect(',
              'def observe_native_availability(',
              'def _native_settle_remaining(',
              'async def _apply_queued_power_switch(',
              'async def _apply_automatic_reconciliation(',
              'settings_saved=True',
          ):
              assert marker in runtime,marker
          assert 'observe_native_availability(entity_id, old, new)' in Path('manager.py').read_text()
          assert 'needs_recovery' in Path('button.py').read_text()
          assert "entry.resumeButton?.state!=='unavailable'" in Path('frontend/air-quality-advisor-card.js').read_text()
          assert len(list(Path('translations').glob('*.json')))==38
          print('BETA98_SAVED_INTENT_GRACE_RETRY_AND_UI_SOURCE_GUARD=PASS')
          PY
          git fetch --no-tags --depth=1 origin 9f8906852792c5e0a1ff5c4b10260bdb24648348
          python -I - <<'PY'
          import subprocess
          changes=set(subprocess.check_output(['git','diff','--name-only',
            '9f8906852792c5e0a1ff5c4b10260bdb24648348','HEAD','--'],
             text=True).splitlines())
          allowed={
            '.github/releases/v0.6.0b98.md',
            '.github/tests/test_beta61_supply_selection.py',
            '.github/tests/test_beta88_power_startup_and_retries.py',
            '.github/tests/test_beta85_resume_browser.py',
            '.github/tests/test_beta89_automatic.py',
            '.github/tests/test_beta98_nonblocking_ack.py',
            '.github/tests/test_beta98_native_reconnect.py',
            '.github/tests/test_beta98_resume_card.py',
            '.github/workflows/publish-beta98.yml',
            '.github/workflows/verify-beta98-ack.yml',
            'button.py','equipment_resume.py','equipment_runtime.py',
            'equipment_status.py','frontend/air-quality-advisor-card.js',
            'manager.py','manifest.json',
          }
          assert changes==allowed,('BETA98_WRONG_FILES',
              sorted(changes-allowed),sorted(allowed-changes))
          assert not changes.intersection({
            'equipment_power_switch.py','equipment_window.py',
            'climate_arbitration.py','pid_phase.py','pid_restart.py',
            'climate.py','device_controls.py','device_hierarchy.py'})
          print('BETA98_HARDWARE_COMMAND_LIMITS_AND_SOURCE_REGISTRY_UNCHANGED=PASS')
          PY
          git diff --check
      - name: Actual user edit, native ACK, Auto and HA reconnect behavior
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta98_nonblocking_ack.py
          python -I .github/tests/test_beta98_native_reconnect.py
          python -I .github/tests/test_beta61_supply_selection.py
          python -I .github/tests/test_beta88_power_startup_and_retries.py
          python -I .github/tests/test_beta89_automatic.py
          python -I .github/tests/test_beta85_native_resume.py
          python -I .github/tests/test_beta72_resume_running.py
      - name: Preserve physical ACK, compressor PWM, window and power safety
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta91_dry_only_pwm.py
          python -I .github/tests/test_beta91_pid_restart.py
          python -I .github/tests/test_beta94_room_windows.py
          python -I .github/tests/test_beta94_dry_automatic.py
          python -I .github/tests/test_beta74_upstream_dwell.py
          python -I .github/tests/test_beta83_supply_safety.py
          python -I .github/tests/test_beta97_battery_power_selector.py
      - name: Install Home Assistant and Chromium test libraries
        run: python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
      - name: Original compact and new self-recovery browser interactions
        run: |
          set -euo pipefail
          python -I .github/tests/test_beta87_compact_browser.py
          python -I .github/tests/test_beta89_card.py
          python -I .github/tests/test_beta92_lovelace_scroll.py
          python -I .github/tests/test_beta93_native_entity_links.py
          python -I .github/tests/test_beta95_card.py
          python -I .github/tests/test_beta98_resume_card.py
