name: Beta73 persisted native ON time and restart recovery

on:
  push:
    branches:
      - 'fix/beta73-persisted-native-on-recovery-20261031'

permissions:
  contents: read

jobs:
  recovery-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate source, manifest, all JSON and frontend syntax
        run: |
          set -euo pipefail
          python -I -m compileall -q .
          python -I - <<'PY'
          from pathlib import Path
          import json
          assert json.loads(Path('manifest.json').read_text())['domain']=='environment_manager'
          for p in Path('.').rglob('*.json'):json.loads(p.read_text())
          print('PASS source and localizations')
          PY
          node --check frontend/air-quality-advisor-card.js
      - name: Actual persisted ON restart and physical minimum dwell behavior
        run: python -I .github/tests/test_beta73_restart_power_history.py
      - name: Existing Resume, window, PID, sleep, AQI, shade, supplier protection
        run: |
          set -euo pipefail
          for f in \
            .github/tests/test_beta72_resume_running.py \
            .github/tests/test_beta71_window_startup.py \
            .github/tests/test_beta70_pid_profile.py \
            .github/tests/test_beta69_shade_lux.py \
            .github/tests/test_beta61_supply_selection.py \
            .github/tests/test_beta62_pid_races.py \
            .github/tests/test_beta63_cold_start.py \
            .github/tests/test_beta64_sleep_idle.py \
            .github/tests/test_beta65_data.py \
            .github/tests/test_beta66_windows.py \
            .github/tests/test_beta67_aqi.py \
            .github/tests/test_beta68_scheduler.py \
            .github/tests/test_beta68_metadata.py; do
            [[ -f "$f" ]] || continue
            echo "TEST $f"
            python -I "$f"
          done
      - name: HA dispatcher and Chromium stream responsiveness
        run: |
          python -m pip install 'homeassistant==2026.10.4' 'playwright==1.57.0'
          python -I .github/tests/test_beta68_events.py
          python -I .github/tests/test_beta68_browser.py
