name: Verify Home Environment Manager beta 107 room metrics
on:
  push:
    branches: ['work/v0.6.0b107']
permissions:
  contents: read
concurrency:
  group: hem-beta107-room-metrics
  cancel-in-progress: true
jobs:
  verify-room-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install browser test dependency
        run: python -m pip install 'playwright==1.57.0'
      - name: Check room metric typography, separation, responsive geometry and clicks
        env:
          HEM_TEST_SCREENSHOT_DIR: artifacts/room-overview
        run: |
          node --check frontend/air-quality-advisor-card.js
          python -I .github/tests/test_beta107_room_metrics.py
      - name: Preserve browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hem-beta107-room-overview
          path: artifacts/room-overview
          if-no-files-found: error
          retention-days: 7
